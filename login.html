<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="rbThemeColor" content="#0e1013">
<meta name="robots" content="noindex">
<script>
(function () {
  try {
    var t = localStorage.getItem('rb21_theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
    var m = document.getElementById('rbThemeColor');
    if (m) m.setAttribute('content', t === 'light' ? '#f6f4ef' : '#0e1013');
  } catch (e) { }
})();
</script>
<title>Masuk · Ruang Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0e1013;--bg2:#14171c;--card:#16191f;--card2:#1c2028;--field:#111419;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--tx:#eceef2;--mut:#98a1ae;
  --accent:#e0a172;--accent2:#c98a5e;--accent-soft:rgba(224,161,114,.13);
  --ok:#5ec9a0;--ok-soft:rgba(94,201,160,.12);
  --no:#ef7b74;--no-soft:rgba(239,123,116,.12);
  --warn:#e3bd72;--warn-soft:rgba(227,189,114,.11);--warn-line:rgba(227,189,114,.28);
  --shadow:0 1px 2px rgba(0,0,0,.28),0 18px 40px -34px rgba(0,0,0,.8);
  --font-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f6f4ef;--bg2:#fbfaf7;--card:#ffffff;--card2:#f3f1eb;--field:#faf9f6;
  --line:#e6e2d9;--line2:#d2ccbf;--tx:#1d2025;--mut:#626b76;
  --accent:#a4512b;--accent2:#8a4324;--accent-soft:rgba(164,81,43,.10);
  --ok:#1e7a5c;--ok-soft:rgba(30,122,92,.10);
  --no:#b23a38;--no-soft:rgba(178,58,56,.09);
  --warn:#8a6116;--warn-soft:rgba(138,97,22,.09);--warn-line:rgba(138,97,22,.24);
  --shadow:0 1px 2px rgba(29,32,37,.05),0 18px 40px -36px rgba(29,32,37,.5);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:clamp(18px,4vw,48px) clamp(14px,3vw,24px);
  font-family:var(--font-ui);
  color:var(--tx);line-height:1.62;letter-spacing:-.004em;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg2),var(--bg) 480px);
  background-repeat:no-repeat;
}
html[data-theme=light] body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,#fff,var(--bg) 480px);
}
.auth-wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
.auth-brand{display:flex;align-items:center;gap:12px;padding:0 4px}
.brand-logo{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;
  background:var(--accent-soft);border:1px solid var(--line);flex:0 0 auto;
}
.auth-brand b{display:block;font-family:var(--font-ui);font-size:1.12rem;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.auth-brand small{display:block;font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.auth-card{
  background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,32px);
  box-shadow:var(--shadow);text-align:center;
}
html[data-theme=light] .auth-card{background:var(--card)}
.auth-ico{
  width:64px;height:64px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;
  font-size:1.7rem;background:var(--accent-soft);border:1px solid var(--line);
}
.auth-card h1{
  font-family:var(--font-ui);font-size:clamp(1.22rem,4.4vw,1.44rem);line-height:1.28;
  font-weight:800;letter-spacing:-.028em;margin:0 0 8px;
}
.auth-card p{margin:0;color:var(--mut);font-size:.88rem;line-height:1.7;max-width:36ch;margin-inline:auto}
.auth-actions{display:grid;gap:9px;margin-top:22px}
.auth-btn{
  width:100%;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid transparent;border-radius:11px;padding:13px 18px;font:inherit;font-size:.92rem;font-weight:750;
  letter-spacing:0;cursor:pointer;color:#1a1208;text-decoration:none;
  background:var(--accent);
  transition:opacity .14s,background .14s,border-color .14s;
}
html[data-theme=light] .auth-btn{color:#fff}
.auth-btn:hover{opacity:.95}
.auth-btn:active{transform:scale(.988)}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-btn.alt{background:var(--card2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.auth-btn.alt:hover{background:var(--field);border-color:var(--line2)}
.auth-btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);box-shadow:none;font-weight:650}
.auth-btn.ghost:hover{color:var(--tx);background:var(--field)}
.auth-btn:focus-visible,.auth-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.auth-hint{
  margin-top:16px;padding:12px 14px;border-radius:14px;text-align:left;
  background:var(--field);border:1px solid var(--line);font-size:.78rem;line-height:1.65;color:var(--mut);
}
.auth-hint b{color:var(--tx)}
.auth-note{margin-top:12px;font-size:.74rem;line-height:1.6;color:var(--mut)}
.auth-err{
  margin-top:12px;padding:11px 13px;border-radius:13px;text-align:left;
  background:var(--no-soft);border:1px solid rgba(255,111,128,.24);
  color:var(--tx);font-size:.8rem;line-height:1.55;overflow-wrap:anywhere;
}
.auth-err:empty{display:none}
.auth-acct{
  display:inline-flex;align-items:center;gap:8px;max-width:100%;margin-top:14px;
  padding:7px 13px;border-radius:999px;background:var(--field);border:1px solid var(--line);
  font-size:.78rem;color:var(--mut);overflow-wrap:anywhere;
}
.auth-badge{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  font-size:.7rem;font-weight:750;letter-spacing:.02em;margin-bottom:14px;
  background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--tx);
}
.auth-badge.ok{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.auth-badge.no{background:var(--no-soft);border-color:rgba(255,111,128,.24);color:var(--no)}
.auth-spin{
  width:26px;height:26px;border-radius:50%;margin:0 auto 14px;
  border:3px solid var(--line);border-top-color:var(--accent);animation:authspin .8s linear infinite;
}
@keyframes authspin{to{transform:rotate(360deg)}}
.auth-foot{
  margin:2px 4px 0;text-align:center;font-size:.72rem;line-height:1.65;color:var(--mut);
}
.auth-foot a,.auth-link{color:var(--accent);text-decoration:none;font-weight:700}
.auth-foot a:hover,.auth-link:hover{text-decoration:underline}
@media(max-width:420px){
  .auth-card{border-radius:21px;padding:20px 17px}
  .auth-btn{min-height:48px}
}
@media(prefers-reduced-motion:reduce){
  .auth-spin{animation:none}
  .auth-btn{transition:none}
}
</style>
</head>
<body>
<main class="auth-wrap">
  <header class="auth-brand">
    <span class="brand-logo" aria-hidden="true">📖</span>
    <div>
      <b>Ruang Belajar</b>
      <small>Pelajaran · Bahasa · Trading</small>
    </div>
  </header>

  <section id="authCard" class="auth-card" aria-live="polite">
    <div class="auth-spin" aria-hidden="true"></div>
    <h1>Memeriksa sesi…</h1>
    <p>Menyiapkan halaman masuk.</p>
  </section>

  <p class="auth-foot">Akses dibatasi. Data soal, riwayat, dan catatan tersimpan di akunmu sendiri.<br>Butuh bantuan? <a href="https://www.instagram.com/kyenth29?lqvp=MXI2cmk3NDl4Y3o0Yw==" target="_blank" rel="noopener noreferrer">Hubungi admin via Instagram</a>.</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="rb-firebase-config.js"></script>
<script src="rb-auth.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var card = $('authCard');
  var auth = null, db = null, user = null, busy = false, redirecting = false;
  var CONTACT = 'https://www.instagram.com/kyenth29?lqvp=MXI2cmk3NDl4Y3o0Yw==';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setCard(html) { if (card) card.innerHTML = html; }
  function storedMsg() {
    try {
      var m = sessionStorage.getItem('rb_auth_msg');
      if (m) sessionStorage.removeItem('rb_auth_msg');
      return m || '';
    } catch (e) { return ''; }
  }

  function renderLogin(err) {
    var q = new URLSearchParams(location.search);
    var st = q.get('state');
    var ended = st && st !== 'masuk' ? 'Sesi sebelumnya berakhir. Masuk lagi untuk melanjutkan.' : '';
    setCard(
      '<div class="auth-ico" aria-hidden="true">🎓</div>'
      + '<h1>Masuk untuk mulai belajar</h1>'
      + '<p>Gunakan akun Google yang sudah diizinkan admin. Setelah masuk, kamu langsung dibawa ke halaman belajar.</p>'
      + '<div class="auth-actions">'
      + '<button class="auth-btn" type="button" id="rbLoginBtn" onclick="rbAuthLogin()">🔑 Masuk dengan Google</button>'
      + '<a class="auth-btn alt" href="' + CONTACT + '" target="_blank" rel="noopener noreferrer">📩 Hubungi admin via Instagram</a>'
      + '</div>'
      + '<div class="auth-hint">Akun baru berstatus <b>menunggu persetujuan admin</b>. Bila sudah disetujui tetapi masih tertahan, tekan <b>Cek lagi</b> di halaman status atau minta admin menyetujui emailmu.</div>'
      + (ended ? '<div class="auth-note">' + ended + '</div>' : '')
      + '<div class="auth-err" id="authErr" role="alert">' + esc(err || '') + '</div>'
    );
  }

  function renderChecking(msg) {
    setCard(
      '<div class="auth-spin" aria-hidden="true"></div>'
      + '<h1>Memeriksa izin akses…</h1>'
      + '<p>' + esc(msg || 'Membaca status akun di server.') + '</p>'
    );
  }

  function renderStatus(state, msg) {
    var T = {
      menunggu: { ico: '⏳', badge: 'Menunggu persetujuan', cls: '', title: 'Akunmu sudah terdaftar', body: 'Admin belum mengizinkan akses. Kamu bisa masuk setelah admin menyetujui akun ini.' },
      diblokir: { ico: '🚫', badge: 'Akses diblokir', cls: 'no', title: 'Akses diblokir', body: 'Admin memblokir akun ini. Hubungi admin bila menurutmu ini keliru.' },
      error: { ico: '⚠️', badge: 'Gagal memeriksa izin', cls: 'no', title: 'Status akses belum terbaca', body: 'Periksa koneksi lalu coba lagi. Bila tetap gagal, hubungi admin.' }
    }[state] || { ico: '⚠️', badge: 'Status tidak dikenal', cls: 'no', title: 'Status akses belum terbaca', body: 'Coba lagi atau hubungi admin.' };
    setCard(
      '<div class="auth-ico" aria-hidden="true">' + T.ico + '</div>'
      + '<div class="auth-badge ' + T.cls + '">' + T.badge + '</div>'
      + '<h1>' + T.title + '</h1>'
      + '<p>' + T.body + '</p>'
      + (msg ? '<div class="auth-err" role="alert">' + esc(msg) + '</div>' : '')
      + (user && user.email ? '<div class="auth-acct">' + esc(user.email) + '</div>' : '')
      + '<div class="auth-actions">'
      + '<button class="auth-btn" type="button" id="rbCheckBtn" onclick="rbAuthCheck()">🔄 Cek lagi</button>'
      + '<a class="auth-btn alt" href="' + CONTACT + '" target="_blank" rel="noopener noreferrer">📩 Hubungi admin</a>'
      + '<button class="auth-btn ghost" type="button" onclick="rbAuthLogout()">Keluar dari akun</button>'
      + '</div>'
    );
  }

  function renderFatal(msg) {
    setCard(
      '<div class="auth-ico" aria-hidden="true">⚠️</div>'
      + '<h1>Halaman masuk tidak bisa dimuat</h1>'
      + '<p>Firebase gagal disiapkan. Periksa koneksi internet lalu muat ulang halaman.</p>'
      + '<div class="auth-err" role="alert">' + esc(msg || '') + '</div>'
      + '<div class="auth-actions"><button class="auth-btn alt" type="button" onclick="location.reload()">Muat ulang</button></div>'
    );
  }

  function setBusy(v) {
    busy = !!v;
    var b = $('rbLoginBtn') || $('rbCheckBtn');
    if (b) { b.disabled = !!v; }
  }

  function goApp() {
    if (redirecting) return;
    redirecting = true;
    renderChecking('Akses disetujui. Membuka halaman belajar…');
    location.replace('index.html');
  }

  function isMobile() {
    return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  }

  window.rbAuthLogin = async function () {
    if (!auth) return renderFatal('Firebase Auth tidak tersedia.');
    var err = $('authErr');
    if (err) err.textContent = '';
    setBusy(true);
    var provider = new firebase.auth.GoogleAuthProvider();
    try {
      /* Popup Google sering diblokir di hp; redirect adalah jalur resmi seluler. */
      if (isMobile()) { await auth.signInWithRedirect(provider); return; }
      await auth.signInWithPopup(provider);
      /* onAuthStateChanged akan memeriksa izin dan membuka aplikasi. */
    } catch (e) {
      var m = String(e && e.message || e), code = String(e && e.code || '');
      if (/popup-blocked|operation-not-supported/i.test(code + ' ' + m)) {
        try { await auth.signInWithRedirect(provider); return; }
        catch (e2) { m = String(e2 && e2.message || e2); }
      }
      setBusy(false);
      if (/popup-closed-by-user|cancelled-popup-request/i.test(m)) m = 'Jendela Google ditutup sebelum selesai. Coba lagi.';
      else if (/popup-blocked/i.test(m)) m = 'Popup Google diblokir browser. Izinkan popup untuk situs ini lalu coba lagi.';
      else if (/network-request-failed/i.test(m)) m = 'Koneksi gagal. Periksa internet lalu coba lagi.';
      if (err) err.textContent = 'Gagal masuk: ' + m;
      else renderLogin('Gagal masuk: ' + m);
    }
  };

  window.rbAuthLogout = async function () {
    if (!auth) return renderLogin();
    setBusy(true);
    try { await auth.signOut(); } catch (e) { }
    setBusy(false);
    renderLogin();
  };

  window.rbAuthCheck = async function () {
    if (!user) return renderLogin();
    await checkAccess();
  };

  /* Logika izin ada di rb-auth.js agar halaman masuk dan isi aplikasi
     memakai aturan yang sama persis (tidak ada dua versi cek akses). */
  var checkRun = 0;
  async function checkAccess() {
    /* Guard sendiri: onAuthStateChanged mengosongkan busy, jadi tanpa ini dua
       pemeriksaan bisa berjalan bersamaan dan saling menimpa tampilan. */
    if (!user || redirecting || checkRun) return;
    if (!window.RBAuth || typeof window.RBAuth.check !== 'function') {
      return renderFatal('Modul pemeriksaan akses (rb-auth.js) tidak termuat. Muat ulang halaman.');
    }
    checkRun++;
    setBusy(true);
    renderChecking('Membaca status akun dan izin Trading…');
    var r;
    try {
      r = await window.RBAuth.check(user, { db: db });
    } catch (e) {
      r = { ok: false, status: 'error', message: 'Gagal memeriksa izin: ' + String((e && e.message) || e) };
    }
    checkRun--;
    setBusy(false);
    if (redirecting) return;
    if (r && r.ok) return goApp();
    renderStatus((r && r.status) || 'error', (r && r.message) || '');
  }

  function boot() {
    var cfg = window.RB_FIREBASE_CONFIG;
    if (!cfg) return renderFatal('Konfigurasi Firebase tidak ditemukan.');
    try {
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      return renderFatal(e && e.message || String(e));
    }
    var st = new URLSearchParams(location.search).get('state');
    var sm = storedMsg();
    /* Hasil signInWithRedirect: tanpa ini kegagalan redirect tampil sebagai
       "Memeriksa sesi…" tanpa penjelasan. */
    auth.getRedirectResult().catch(function (e) {
      var c = String(e && e.code || '');
      if (/popup-closed|cancelled-popup|no-auth-event/i.test(c)) return;
      var m = String((e && e.message) || e);
      if ($('authErr')) $('authErr').textContent = 'Gagal masuk: ' + m;
      else renderLogin('Gagal masuk: ' + m);
    });
    /* Firebase tanpa jaringan bisa tidak pernah memanggil callback sesi. */
    var seenState = false;
    var stateTimer = setTimeout(function () {
      if (seenState) return;
      renderLogin('Pemeriksaan sesi terlalu lama. Periksa koneksi lalu tekan Masuk dengan Google.');
    }, 15000);
    auth.onAuthStateChanged(function (u) {
      seenState = true;
      clearTimeout(stateTimer);
      user = u || null;
      /* Popup login masih berstatus sibuk saat callback ini dipanggil.
         Reset dulu supaya checkAccess tidak keluar karena guard busy. */
      busy = false;
      if (!u) {
        renderLogin(st === 'error' && sm ? sm : '');
        return;
      }
      checkAccess();
    });
  }

  boot();
})();
</script>
</body>
</html>
