<script>

// ✏️ [TEKS BISA DIUBAH] Daftar teks MAPEL: Nama pelajaran di menu. PERHATIAN: nama ini juga tersimpan di database (soal/riwayat lama); mengganti nama membuat data lama tidak terbaca di pelajaran baru.
const MAPEL={
  sekolah:['Bahasa Indonesia','Matematika','IPA','IPS','Bahasa Inggris','Umum (Trivia Dunia)']
};
const SAMPLE=[
  {kategori:'sekolah',mapel:'Matematika',q:'Hasil dari 3/4 + 1/8 adalah ...',o:['7/8','4/12','1','5/8'],a:0,e:'3/4 = 6/8, jadi 6/8 + 1/8 = 7/8.'},
  {kategori:'sekolah',mapel:'Bahasa Indonesia',q:'Kata baku yang tepat adalah ...',o:['Apotik','Apotek','Aphotek','Apotex'],a:1,e:'Menurut KBBI bentuk bakunya apotek.'},
  {kategori:'trading',mapel:'SMC / ICT',q:'Order Block bullish biasanya adalah ...',o:['Candle bullish terakhir sebelum jatuh','Candle bearish terakhir sebelum kenaikan impulsif','Gap di tengah trend','Equal high'],a:1,e:'OB bullish = candle bearish terakhir sebelum pergerakan naik impulsif.'},
  {kategori:'trading',mapel:'Risk Management',q:'Risiko per trade yang umum disarankan?',o:['10-20%','5-10%','1-2%','Semua saldo'],a:2,e:'Banyak trader membatasi risiko 1-2% ekuitas per trade.'}
];

let db=null,auth=null,user=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth=firebase.auth()}catch(e){console.error(e);document.getElementById('warn').innerHTML='<div class="warn">⚠️ Firebase gagal dimuat.</div>'}

const S={sec:'sekolah',mapel:'Bahasa Indonesia',tab:'latihan',qs:[],i:0,score:0,done:false,chat:{},gen:[],bank:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[(.+?)\|(https?:[^\]\s]+)\]\]/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--b)">$1</a>').replace(/\n/g,'<br>');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isUmum=()=>S.mapel.startsWith('Umum');

/* ---------- LATIHAN ---------- */
async function saveNote(jenis){const news=jenis==='news',el=$(news?'catn':'catt');if(!el)return;const v=el.value.trim();if(!v)return;try{await db.collection('catatan').add({uid:user.uid,teks:v,jenis:news?'news':'trade',waktu:firebase.firestore.FieldValue.serverTimestamp()});el.value='';loadNotes()}catch(e){alert('Gagal menyimpan catatan: '+e.message)}}
async function loadNotes(){try{const s=await db.collection('catatan').where('uid','==',user.uid).limit(60).get();const r=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.waktu?.seconds||0)-(a.waktu?.seconds||0));const isNews=x=>x.jenis==='news'||/^\[(news|analisis pro|news analisis)/i.test(String(x.teks||'').trim());const tr=r.filter(x=>!isNews(x)).slice(0,12),nw=r.filter(isNews).slice(0,12);if($('notesTrade'))$('notesTrade').innerHTML=tr.length?tr.map(noteHtml).join(''):'<div class="mut small">Belum ada catatan trade.</div>';if($('notesNews'))$('notesNews').innerHTML=nw.length?nw.map(noteHtml).join(''):'<div class="mut small">Belum ada catatan news.</div>'}catch(e){if($('notesTrade'))$('notesTrade').textContent='Gagal memuat catatan.';if($('notesNews'))$('notesNews').textContent='Gagal memuat catatan.'}}
function noteHtml(x){const id=String(x.id||'').replace(/[^A-Za-z0-9_-]/g,'');return `<div class="note" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px"><div style="min-width:0;white-space:pre-wrap">${esc(x.teks)}</div><button class="x" onclick="delNote('${id}')" aria-label="Hapus catatan" title="Hapus">🗑</button></div>`}
async function delNote(id){if(!confirm('Hapus catatan ini?'))return;try{await db.collection('catatan').doc(id).delete();loadNotes()}catch(e){alert('Gagal menghapus: '+e.message)}}

/* ---------- TUTOR AI ---------- */
/* ---------- BUAT SOAL (AI) ---------- */
function cleanOpt(s){return String(s).replace(/^\s*[A-Da-d][.)]\s+/,'')}
/* ---------- BANK SOAL ---------- */
// ✏️ [TEKS BISA DIUBAH] 🗂 TKA & Sekolah → Bank soal — fungsi loadBank(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function loadBank(){
  try{const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
    S.bank=s.docs.map(d=>({id:d.id,...d.data()}));drawBank();
  }catch(e){($('bl')||{}).textContent='Gagal memuat: '+e.message}
}
// ✏️ [TEKS BISA DIUBAH] 🗂 TKA & Sekolah → Bank soal — fungsi del(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function del(id){if(!confirm('Hapus soal ini?'))return;await db.collection('soal').doc(id).delete();S.bank=S.bank.filter(x=>x.id!==id);drawBank()}
// ✏️ [TEKS BISA DIUBAH] 🗂 TKA & Sekolah → Bank soal — fungsi delAll(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function delAll(){
  if(!confirm(`Hapus SEMUA ${S.bank.length} soal ${S.mapel}? Tidak bisa dibatalkan.`))return;
  for(let i=0;i<S.bank.length;i+=20){const b=db.batch();S.bank.slice(i,i+20).forEach(x=>b.delete(db.collection('soal').doc(x.id)));await b.commit()}
  S.bank=[];drawBank();
}
async function seed(){
  const b=db.batch();SAMPLE.filter(x=>x.kategori===S.sec&&x.mapel===S.mapel).forEach(x=>b.set(db.collection('soal').doc(),{...x,uid:user.uid}));await b.commit();pBank();
}
// ✏️ [TEKS BISA DIUBAH] 🔐 Login, akses & izin — fungsi loginView(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
function loginView(){
  document.querySelector('.tabs').style.display='none';$('userbar').innerHTML='';
  $('app').innerHTML=`<div class="card" style="text-align:center;padding:32px 20px"><div class="hero-ico">🔐</div><h3 style="font-size:1.24rem;justify-content:center;margin:0 0 8px;letter-spacing:-.02em">Masuk untuk mulai belajar</h3><div class="mut small" style="margin-bottom:20px;line-height:1.65;max-width:34ch;margin-left:auto;margin-right:auto">Soal, riwayat, dan catatanmu tersimpan di akunmu sendiri.</div><button class="btn full" onclick="login()">🔵 Masuk dengan Google</button><div class="hint">🔒 Akses dibatasi. Setelah masuk, akunmu <b>menunggu persetujuan admin</b>. Bila sudah disetujui tetapi masih tertahan, tekan <b>Cek lagi</b> atau hubungi admin.</div><div id="lerr" class="small" style="margin-top:12px;overflow-wrap:anywhere"></div></div>`;
}
// ✏️ [TEKS BISA DIUBAH] 🔐 Login, akses & izin — fungsi login(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function login(){try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){$('lerr').textContent='Gagal masuk: '+e.message}}
if(auth)auth.onAuthStateChanged(u=>{

    ${S.exam?`<div class="nav">${S.qs.map((_,k)=>`<button class="nb ${k===i?'cur':''} ${answered(k)?'done':''} ${S.flag[k]?'flag':''}" onclick="S.i=${k};show()">${k+1}</button>`).join('')}</div><button class="btn alt full" onclick="confirmFinish()">Kumpulkan sekarang</button>`:''}</div>`;

  const t=ans.length,p=Math.round(S.score/t*100),w=ans.filter(x=>!isOK(x));S.wrong=w;S.curId=null;const na=ans.filter(unans).length;

  const ok=await dedupe(arr.map(x=>{const n=normQ(x);return n?{...n,sub:x.sub||''}:null}).filter(Boolean));

function verbForms(w){

  s=w==='have'?'has':/(s|x|z|ch|sh|o)$/.test(w)?w+'es':/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':w+'s';
  const r=IRRMAP[w];return{v1:w,v2:r?r[1]:ed,v3:r?r[2]:ed,ing:ING_FIX[w]||ing,s:w==='be'?'is':s,irr:!!r};
}

<script>

const POSID={noun:'kata benda',verb:'kata kerja',adjective:'kata sifat',adverb:'kata keterangan',pronoun:'kata ganti',preposition:'kata depan',conjunction:'kata sambung',interjection:'kata seru',exclamation:'kata seru',determiner:'kata penentu',article:'kata sandang',numeral:'kata bilangan',particle:'partikel',prefix:'awalan',suffix:'akhiran',contraction:'singkatan',phrase:'frasa',idiom:'idiom'};

async function trans(text,from,to){
  const key='ktr_'+from+to+'_'+text;try{const c=localStorage.getItem(key);if(c)return c}catch(e){}
  let t='';

    t=(j.responseStatus==null||+j.responseStatus===200)?(j.responseData&&j.responseData.translatedText||''):'';if(/MYMEMORY WARNING|INVALID|QUERY LENGTH/i.test(t))t=''}catch(e){}

// ✏️ [TEKS BISA DIUBAH] 📚 Kamus Inggris — fungsi kEnrich(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function kEnrich(w,items){

let ITEMLIST=[];
// ✏️ [TEKS BISA DIUBAH] 📚 Kamus Inggris — fungsi verbCard(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function verbCard(w,d,base){
  const vb=base||w,f=verbForms(vb),forms=[...new Set([f.v1,...f.v2.split('/'),...f.v3.split('/'),f.ing,f.s])],ph={};
  await Promise.all(forms.map(async x=>{ph[x]=phon(x===w?d:await dict(x))}));
  const cell=x=>x.split('/').map(y=>`<div style="margin-bottom:4px"><b>${esc(y)}</b> <button class="x" style="background:#242424;color:#f2f2f2" onclick="playAudio('${esc(ph[y]&&ph[y].a||'')}','${esc(y)}')">🔊</button> <span class="mut small">${esc(ph[y]&&ph[y].t||'')}</span></div>`).join('');
  return `<div class="card"><h3>🔁 Verb "${esc(f.v1)}" ${f.irr?'(irregular)':'(regular — bentuk dibuat dari aturan ejaan, cek ulang bila ragu)'}</h3>${IRRREV[w]?`<div class="mut small" style="margin-bottom:8px">"${esc(w)}" adalah bentuk lampau/participle dari "${esc(base)}".</div>`:''}
  ${['v1','v2','v3','ing','s'].map(k=>`<div class="exp" style="margin-bottom:10px;color:var(--tx)"><div style="color:var(--b);font-weight:700">${USE[k][0]}</div><div style="margin:6px 0">${cell(f[k])}</div><div class="small"><b>Kapan dipakai:</b> ${esc(USE[k][1])}</div><div class="small mut" style="margin-top:4px"><b>Pola:</b> ${esc(USE[k][2])}</div><div id="ex_${k}" class="small" style="margin-top:8px"><span class="mut">⏳ contoh kalimat...</span></div></div>`).join('')}<div id="ex_tip"></div></div>`;
}
// ✏️ [TEKS BISA DIUBAH] 📚 Kamus Inggris — fungsi kLookup(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function kLookup(w){
  const my=++KL,box=$('kbody'),live=()=>my===KL&&$('kbody');
  box.innerHTML='<div class="card">⏳ Mencari...</div>';addHist(w);
  const base=IRRMAP[w]?w:IRRREV[w]||null;
  const [R,tr]=await Promise.all([dictR(w),trans(w,'en','id'),loadWords()]);if(!live())return;
  const d=R.d;
  if(R.err&&!base){box.innerHTML=`<div class="card">⚠️ Gagal memuat "<b>${esc(w)}</b>": ${esc(R.err)}.<button class="btn full" onclick="kLookup('${esc(w).replace(/'/g,'')}')">🔄 Coba lagi</button></div>`;return}
  if(!d&&!base){
    let sg=[],en='';try{[sg,en]=await Promise.all([fetch('https://api.datamuse.com/words?max=8&sp='+encodeURIComponent(w)).then(r=>r.json()).catch(()=>[]),trans(w,'id','en')])}catch(e){}
    if(!live())return;
    const ens=(en||'').split(/[,;]/).map(x=>x.trim().toLowerCase()).filter(x=>x&&x!==w&&/^[a-z' -]+$/.test(x));
    box.innerHTML=`<div class="card">Kata "<b>${esc(w)}</b>" tidak ditemukan di kamus Inggris.${ens.length?`<div style="margin-top:10px">🇮🇩→🇬🇧 Jika "${esc(w)}" bahasa Indonesia, terjemahan Inggrisnya: ${ens.map(chip).join('')}</div>`:''}${sg.length?`<div style="margin-top:10px">Mungkin maksudmu: ${sg.map(x=>chip(x.word)).join('')}</div>`:''}</div>`;return}
  const p=phon(d),ms=(d||[]).flatMap(e=>e.meanings||[]);let k=0;const items=[];ITEMS={};
  const defs=ms.map(m=>{if(k>=12)return'';const pos=m.partOfSpeech;
    const rows=(m.definitions||[]).slice(0,3).map(x=>{if(k>=12)return'';const i=k++;items.push({i,pos,def:x.definition,ex:x.example||''});ITEMS[i]={ex:x.example||''};
      return `<div class="small" style="margin:10px 0 10px 4px">• ${esc(x.definition)}<div id="dfid_${i}" class="mut" style="margin-top:3px">🇮🇩 <i>menerjemahkan...</i></div>${x.example?`<div class="mut" style="margin-top:4px">“${esc(x.example)}” ${spBtn(x.example)}<div id="dfxt_${i}" class="small"></div></div>`:''}<div id="dfex_${i}"></div></div>`}).join('');
    return `<div style="margin-bottom:14px"><i style="color:var(--b);font-size:1.05rem">${esc(pos)}</i> <span class="mut small">· ${esc(POSID[pos]||'')} <span class="posid" data-pos="${esc(pos)}"></span></span>${rows}${(m.synonyms||[]).length?`<div class="mut small">Sinonim: ${esc(m.synonyms.slice(0,6).join(', '))}</div>`:''}</div>`}).join('');
  ITEMLIST=items;
  const vb=base||(d&&d.some(e=>(e.meanings||[]).some(m=>m.partOfSpeech==='verb'))?w:null);
  const vf=vb?await verbCard(w,d,base):'';if(!live())return;
  const saved=(S.kw||[]).some(x=>x.w===w);
  box.innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">${esc(w)}</h2><span class="mut">${esc(p.t)}</span><button class="x" style="background:#242424;color:#f2f2f2" onclick="playAudio('${esc(p.a)}','${esc(w)}')">🔊 Dengar</button><button id="ksv" class="x" style="background:#242424;color:#f2f2f2" onclick="saveWord('${esc(w)}',${JSON.stringify(tr||'').replace(/"/g,'&quot;')})">${saved?'★ Tersimpan':'☆ Simpan'}</button></div>
    <div style="margin:10px 0">🇮🇩 <b id="kar">${esc(tr||'…')}</b> <span class="mut small">(arti umum, cek ulang)</span></div>${defs||'<div class="mut small">Definisi tidak tersedia untuk bentuk kata ini.</div>'}<div id="kretry"></div>
    <button class="btn alt full" onclick="kAI('${esc(w).replace(/'/g,'')}')">🤖 Penjelasan tambahan, kolokasi & kesalahan umum</button><div id="kai"></div></div>${vf}`;
  if(items.length)kEnrich(w,items);
  if(vb)kExamples(vb,verbForms(vb));
}
/* ===== END V8 ===== */

<script>

async function tcall(body){

  let j;try{j=await r.json()}catch(e){throw new Error('Server error '+r.status+' (kemungkinan timeout, coba lagi)')}

    ${nxt?`<h3 style="margin-top:12px">📌 Jadwal resmi berikutnya <span class="mut small">(tanggal ET dari bls.gov / federalreserve.gov)</span></h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px">${nxt}</div>`:'<div class="warn" style="margin-top:10px">Jadwal resmi tidak terbaca dari BLS/The Fed saat ini; hanya kalender agregator yang tersedia.</div>'}</div>

async function loadQs2(n){
  if(isUmum())return loadQs(n);
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
  let a=s.docs.map(d=>d.data()),sub=(S.sub||'').toLowerCase();
  if(sub)a=a.filter(x=>(x.sub||'').toLowerCase().includes(sub));
  if(S.jenis)a=a.filter(x=>(x.tipe||'pg')===S.jenis);
  if(S.lvl)a=a.filter(x=>(x.tingkat||'')===S.lvl);
  let pick;
  if(S.fresh){const seen=seenGet();pick=a.map(x=>({x,k:(seen[seenKey(x)]||0)+Math.random()*.99})).sort((p,q)=>p.k-q.k).map(p=>p.x).slice(0,n)}else pick=shuffle(a).slice(0,n);
  return shuffle(pick).map(q=>{const t=q.tipe||'pg';if(t==='bs'||t==='essay')return q;const o=shuffle(q.o);return t==='multi'?{...q,o,a:q.a.map(i=>o.indexOf(q.o[i])).sort((p,r)=>p-r)}:{...q,o,a:o.indexOf(q.o[q.a])}});
}

function gradeOf13(lv){
  lv=String(lv||'');let m;
  if((m=lv.match(/^(?:SD|SMP|SMA|SMK) Kelas (\d+)/)))return[+m[1],+m[1]];
  if(/^TKA SMK/.test(lv))return[10,12];
  if(/^TKA SD/.test(lv))return[4,6];if(/^TKA SMP/.test(lv))return[7,9];if(/^TKA SMA|UTBK/.test(lv))return[10,12];
  return null;
}
function scopeOf13(lv){

  const top=g[1],here=[];for(let k=g[0];k<=top;k++)if(c[k])here.push((g[0]!==g[1]?'Kelas '+k+': ':'')+c[k]);

// ✏️ [TEKS BISA DIUBAH] 🎯 TKA & Sekolah → Latihan & riwayat — fungsi drawHist(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
function drawHist(){
  const r=S.att||[],g={};r.forEach(x=>(g[x.mapel]=g[x.mapel]||[]).push(x.skor/x.total*100));S.gk=Object.keys(g);S.avg=g[S.mapel]?avg(g[S.mapel]):null;
  if(!$('stat'))return;
  $('stat').innerHTML=S.gk.length?S.gk.map((m,i)=>`<div style="margin-bottom:12px;cursor:pointer" onclick="showMapel(${i})"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(m)} (${g[m].length}x) ›</span><b>${avg(g[m])}%</b></div><div class="bar" style="margin:4px 0 0"><i style="width:${avg(g[m])}%"></i></div></div>`).join(''):'Belum ada data.';
  if(!$('hist'))return;
  const ids=new Set(r.map(x=>x.id));[...HS13.sel].forEach(i=>{if(!ids.has(i))HS13.sel.delete(i)});
  const vis=HS13.all?r:r.slice(0,10),m=HS13.mode;
  $('hist').innerHTML=r.length?`<div class="row" style="margin-bottom:8px"><button class="btn alt" style="padding:9px" onclick="hMode13()">${m?'✖ Batal pilih':'☑ Pilih beberapa'}</button>${m?`<button class="btn alt" style="padding:9px" onclick="hAll13()">Pilih semua (${r.length})</button><button class="btn red" style="padding:9px" onclick="hDel13()" ${HS13.sel.size?'':'disabled'}>🗑 Hapus (${HS13.sel.size})</button>`:''}</div>`+
    vis.map(x=>`<div class="item" style="cursor:pointer" onclick="${m?`hTog13('${x.id}')`:`showAttempt('${x.id}')`}"><span>${m?`<input type="checkbox" ${HS13.sel.has(x.id)?'checked':''} style="width:18px;pointer-events:none"> `:''}${esc(x.mapel)}${x.mode==='ujian'?' 📝':''} <span class="mut small">${dt(x)}</span></span><span style="white-space:nowrap"><b>${x.skor}/${x.total}${m?'':' ›'}</b>${m?'':` <button class="x" data-id="${x.id}" onclick="event.stopPropagation();delAttempt(this)">🗑</button>`}</span></div>`).join('')+
    (r.length>10?`<button class="btn alt full" style="margin-top:8px" onclick="HS13.all=!HS13.all;drawHist()">${HS13.all?'Tampilkan 10 terbaru saja':'Tampilkan semua ('+r.length+')'}</button>`:'')+
    `<button class="btn red full" onclick="delAllHist()">🗑 Hapus semua riwayat ${S.sec==='trading'?'Trading':'TKA & Sekolah'} (${r.length})</button>`:'Belum ada riwayat.';
}
function hMode13(){HS13.mode=!HS13.mode;HS13.sel.clear();drawHist()}
function hTog13(id){HS13.sel.has(id)?HS13.sel.delete(id):HS13.sel.add(id);drawHist()}
function hAll13(){const r=S.att||[];HS13.sel=HS13.sel.size===r.length?new Set():new Set(r.map(x=>x.id));drawHist()}
// ✏️ [TEKS BISA DIUBAH] 🎯 TKA & Sekolah → Latihan & riwayat — fungsi hDel13(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function hDel13(){
  const list=(S.att||[]).filter(x=>HS13.sel.has(x.id));if(!list.length)return;
  if(!confirm(`Hapus ${list.length} riwayat terpilih? Tidak bisa dibatalkan.`))return;
  try{await delMany(list);const d=new Set(list.map(x=>x.id));S.att=S.att.filter(x=>!d.has(x.id));HS13.sel.clear();HS13.mode=false;drawHist()}
  catch(e){alert('Gagal menghapus: '+e.message+'\nPastikan aturan Firestore mengizinkan delete pada koleksi "hasil" untuk pemilik datanya.')}
}
// ✏️ [TEKS BISA DIUBAH] 🎯 TKA & Sekolah → Latihan & riwayat — fungsi delAttemptM(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
async function delAttemptM(el,i){

    const m=S.curMapel;S.gk=[...new Set(S.att.map(x=>x.mapel))];const k=S.gk.indexOf(m);
    if(k<0){S.tab='latihan';home()}else showMapel(k)}
  catch(e){alert('Gagal menghapus: '+e.message)}
}

</script>

  const scHtml=sc.length?sc.map(x=>`<div style="margin-top:12px"><div style="font-weight:700;color:var(--b)">${esc(x.event)} <span class="small mut">${esc(ldt(x.ts,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}${x.forecast?' • forecast '+esc(x.forecast):''}</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem">${x.scenarios.map(c=>`<tr style="border-top:1px solid var(--line);vertical-align:top"><td style="padding:6px 2px"><b>${esc(c.name)}</b><div class="small mut">${esc(c.desc)}</div></td><td>${B[c.usd.bias]||''} USD ${esc(c.usd.bias)}<div class="small mut">skor ${sg15(c.usd.score)}</div></td><td class="small">${Object.entries(c.pairs).map(([p,v])=>`${B[v.bias]||''} ${esc(p)}`).join('<br>')}</td></tr>`).join('')}</table></div></div>`).join('')+'<div class="mut small" style="margin-top:8px">Skenario = mesin dihitung ulang bila rilis berbeda dari forecast (NFP ±100K, Core CPI ±0.1pp, yield 2Y ±0.15pp setelah FOMC). Ini simulasi aturan, bukan prediksi.</div>':'<div class="mut small" style="margin-top:8px">Tidak ada rilis NFP/CPI/FOMC dalam 14 hari ke depan pada kalender, jadi tidak ada skenario.</div>';
  return `<div class="card"><h3>🧭 Arah berita & data (mesin, tanpa AI)</h3>
  <div class="item"><span><b>Arah USD</b> ${B[u.bias]||''} ${esc(u.bias)}<div class="small mut">cakupan data ${Math.round((u.cov||0)*100)}%</div></span><b>${sg15(u.score)}</b></div>
  <details style="margin:4px 0 8px"><summary class="small" style="cursor:pointer;color:var(--b)">Apa yang membentuk skor</summary>${parts||'<div class="small mut">data belum cukup</div>'}</details>
  <div class="item"><span>Nada berita</span><b style="text-align:right">${toneTxt}</b></div>${toneEv}${fdTxt}${scHtml}</div>`;
}
// ✏️ [TEKS BISA DIUBAH] 🧠 Trading → Analisis (kartu data & hasil) — fungsi validationHtml15(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
function validationHtml15(j){
  const rows=[];let pass=0,warn=0;
  (j.val||[]).forEach(v=>{warn++;rows.push(`<div class="item" style="align-items:flex-start"><span>⚠️ <b>${esc(v.src)}</b><div class="small mut">${esc(v.msg)}</div></span><span class="small" style="text-align:right;color:#e8e8e8">${esc(v.act)}</span></div>`)});
  (j.rc||[]).forEach(r=>{if(r.status==='COCOK')pass++;else warn++;rows.push(`<div class="item"><span>${r.status==='COCOK'?'✅':'⚠️'} Rilis ${esc(r.label)}<div class="small mut">kalender ${esc(r.calendar)} vs resmi ${esc(r.official)}</div></span><span class="small">${esc(r.status)}${r.status==='BEDA'?'<div class="mut">cek periode/revisi</div>':''}</span></div>`)});
  const y=j.yields&&j.yields.check;if(y){if(y.ok)pass++;else warn++;rows.push(`<div class="item"><span>${y.ok?'✅':'⚠️'} Yield Treasury vs FRED<div class="small mut">${esc(y.date)}: 2Y ${esc(j.yields.y2)} vs ${esc(y.d2)} • 10Y ${esc(j.yields.y10)} vs ${esc(y.d10)}</div></span><span class="small">${y.ok?'cocok':'beda'}</span></div>`)}
  Object.entries((j.px&&j.px.pairs)||{}).forEach(([p,v])=>{if(!v.check)return;if(v.check.ok)pass++;else warn++;rows.push(`<div class="item"><span>${v.check.ok?'✅':'⚠️'} Harga ${esc(p)}: ${esc(v.src)} vs ${esc(v.check.other)}<div class="small mut">penutupan ${esc(v.check.date)} beda ${esc(v.check.diffPct)}%</div></span><span class="small">${v.check.ok?'cocok':'beda → tren pair tidak dipakai mesin'}</span></div>`)});
  ((j.data&&j.data.meta&&j.data.meta.check)||[]).forEach(c=>{if(c.ok===true)pass++;else if(c.ok===false)warn++});
  if(!rows.length&&!pass&&!warn)return'';
  return `<div class="card"><h3>🛡️ Validasi data</h3><div class="mut small" style="margin-bottom:8px">✅ ${pass} pemeriksaan lintas-sumber lolos • ⚠️ ${warn} temuan. Data di luar batas wajar otomatis dibuang sebelum dipakai mesin dan AI.</div>${rows.join('')||'<div class="small">Semua pemeriksaan batas wajar dan konsistensi lolos.</div>'}</div>`;
}
// ✏️ [TEKS BISA DIUBAH] 🧠 Trading → Analisis (kartu data & hasil) — fungsi corrHtml15(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
function corrHtml15(j){
  const s=(j.sources||[]).filter(x=>x&&x.uri&&/^https:\/\//.test(x.uri));if(!s.length)return'';
  const T={1:'🏛 resmi',2:'📰 kantor berita besar',3:'🗞 media lain'},L=[...s].sort((a,b)=>(b.corr||1)-(a.corr||1)||(a.tier||3)-(b.tier||3)).slice(0,10);
  return `<div class="card"><h3>🔗 Konfirmasi lintas-sumber</h3>${L.map(x=>`<div class="item" style="align-items:flex-start"><span><a href="${esc(x.uri)}" target="_blank" rel="noopener noreferrer" style="color:var(--b)">${esc(x.title)}</a><div class="small mut">${esc(x.domain)} • ${T[x.tier||3]}${x.ageH!=null?' • '+(x.ageH<48?x.ageH+' jam':Math.round(x.ageH/24)+' hari')+' lalu':''}</div></span><span class="small" style="text-align:right;white-space:nowrap;color:${(x.corr||1)>=2?'#d3d3d3':'var(--mut)'}">${(x.corr||1)>=2?'✅ '+x.corr+' sumber':'1 sumber'}</span></div>`).join('')}<div class="mut small" style="margin-top:6px">"N sumber" = jumlah domain berbeda yang memuat judul serupa. Berita 1 sumber (apalagi tingkat 3) diperlakukan sebagai belum terkonfirmasi.</div></div>`;
}
// ✏️ [TEKS BISA DIUBAH] 🧠 Trading → Analisis (kartu data & hasil) — fungsi ndHtml15(): tulisan yang tampil di web ada di dalam fungsi ini (di antara tanda > < atau di dalam tanda kutip).
function ndHtml15(j){
  const nd=j.pro&&j.pro.news_direction,refs=j.refs||[];if(!nd&&!refs.length)return'';
  const B={BULLISH:'🟢',BEARISH:'🔴',NETRAL:'⚪'};
  return `<div class="card"><h3>🎯 Arah berita menurut AI (divalidasi terhadap mesin)</h3>${nd?`<div class="item"><span><b>Arah USD</b> ${B[nd.usd]||''} ${esc(nd.usd)}</span><span class="small">${nd.engine?'mesin: '+esc(nd.engine.bias)+' ('+sg15(nd.engine.score)+')':''}</span></div>${nd.conflict?'<div class="warn" style="margin:6px 0">⚠️ Bertentangan dengan mesin skor. Utamakan mesin; anggap arah AI tidak terkonfirmasi.</div>':''}<div class="exp" style="color:var(--tx);margin-top:6px">${fmt(nd.summary||'')}</div>${(nd.catalysts||[]).map(c=>`<div style="margin-top:10px"><b>${esc(c.event)}</b><div class="small" style="color:#d3d3d3">Bull jika: ${esc(c.bull_if)}</div><div class="small" style="color:#c3c3c3">Bear jika: ${esc(c.bear_if)}</div>${c.pairs_effect?`<div class="small mut">${esc(c.pairs_effect)}</div>`:''}</div>`).join('')}`:''}${refs.length?`<div class="warn" style="margin-top:10px">Pemeriksaan otomatis atas jawaban AI:<br>${refs.map(r=>'• '+esc(r)).join('<br>')}</div>`:''}</div>`;
}
/* ===== END V15 ===== */
</script>

/* ---------- 3. NEWS & ANALISIS: hitung mundur rilis, sesi pasar, grafik mini, rekam jejak, salin ringkasan ---------- */
function sess16(){
  const now=new Date(),hr=tz=>+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:tz}).format(now)%24;
  const ny=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'})),dow=ny.getDay(),h=ny.getHours();
  const closed=dow===6||(dow===5&&h>=17)||(dow===0&&h<17);

}
let CD16=null;
function fmtCd16(ms){if(ms<=0)return'sedang/baru rilis';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return(d?d+'h ':'')+(h||d?h+'j ':'')+m+'m '+String(x).padStart(2,'0')+'d'}

        if(search&&!big){

  }

    const v=j.validation;
    t+='\n\n🛡️ **Validasi:** '+v.sources+' sumber • '+v.domains+' domain • '+v.official+' resmi • skor '+v.score+'/100';

function v21SetTarget(v){try{localStorage.setItem('rb21_target',String(v))}catch(e){}v21WriteBoard();pBeranda()}
function v21Toast(t){
  let e=document.getElementById('v21toast');
  if(!e){e=document.createElement('div');e.id='v21toast';e.className='v21-toast';document.body.appendChild(e)}
  e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600);
}
function v21Theme(){
  const r=document.documentElement,next=r.getAttribute('data-theme')==='light'?'dark':'light';
  r.setAttribute('data-theme',next);

/* ---------- aktivitas, XP & papan peringkat ---------- */
const V21_CATS=[['s','🎓 Sekolah'],['t','📝 TKA'],['u','🌍 Umum']];
let v21BoardCat='s',v21MiniReq=0,v21PapanReq=0;
function v21CatLabel(c){const x=V21_CATS.find(v=>v[0]===c);return x?x[1]:'Sekolah'}
function v21CatButtons(){return '<div class="v21-cats">'+V21_CATS.map(([k,l])=>'<button class="'+(v21BoardCat===k?'on':'')+'" onclick="v21Cat(\''+k+'\')">'+l+'</button>').join('')+'</div>'}
function v21Cat(c){if(!V21_CATS.some(x=>x[0]===c))return;v21BoardCat=c;if($('v21mini'))v21MiniBoard();if($('v21board'))pPapan()}
function v21Kind(x){
  if(!x)return'';
  const sec=String(x.kategori||x.sec||''),mapel=String(x.mapel||'');
  if(sec==='trading')return'';
  if(x.exam||x.mode==='ujian')return't';
  if(sec==='tka')return't';
  if(sec==='umum')return'u';
  if(sec==='sekolah')return /^umum/i.test(mapel)?'u':'s';
  return'';
}
function v21Stat(x,c){x=x||{};return{b:Math.max(0,+x[c+'Benar']||0),s:Math.max(0,+x[c+'Salah']||0),t:Math.max(0,+x[c+'Total']||0)}}
function v21Acc(st){const t=(st.b||0)+(st.s||0);return t?Math.round((st.b||0)/t*100):0}
function v21Cmp(a,b,c){const A=v21Stat(a,c),B=v21Stat(b,c);return B.b-A.b||v21Acc(B)-v21Acc(A)||(+b.xp||0)-(+a.xp||0)||String(a.nama||'').localeCompare(String(b.nama||''))}
function v21Record(ok,total,meta){
  const a=v21Act(),k=v21Day(new Date()),d=a.days[k]||{n:0,ok:0};
  d.n+=(+total||0);d.ok+=(+ok||0);a.days[k]=d;
  a.xp=(a.xp||0)+(+ok||0)*10+5;
  v21Streak(a);v21SaveAct(a);
  const cat=v21Kind(meta||{});
  if(cat&&!(meta&&meta.retry))v21WriteBoard(a,{prefix:cat,ok:ok,total:total});
  else v21WriteBoard(a);
}
async function v21WriteBoard(a,delta){
  if(!db||!user)return false;
  a=a||v21Act();
  try{
    const ref=db.collection('papan').doc(user.uid);
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref),cur=snap.exists?(snap.data()||{}):{};
      const data={
        uid:user.uid,nama:user.displayName||user.email||'Siswa',foto:user.photoURL||'',
        xp:+(a.xp||0),streak:v21Streak(a),today:v21Today(a).n,target:v21Target(),
        minggu:v21WeekSum(a),updated:firebase.firestore.FieldValue.serverTimestamp()
      };
      if(delta&&['s','t','u'].includes(delta.prefix)){
        const p=delta.prefix,ok=Math.max(0,Math.round(+delta.ok||0)),total=Math.max(0,Math.round(+delta.total||0)),salah=Math.max(0,total-ok);
        data[p+'Benar']=Math.max(0,Math.round(+cur[p+'Benar']||0))+ok;
        data[p+'Salah']=Math.max(0,Math.round(+cur[p+'Salah']||0))+salah;
        data[p+'Total']=Math.max(0,Math.round(+cur[p+'Total']||0))+total;
      }
      tx.set(ref,data,{merge:true});
    });
    return true;
  }catch(e){console.warn('V21 papan:',e.message);return false}
}
async function v21BackfillStats(){
  if(!db||!user)return false;
  const syncKey='rb21_stats_'+user.uid;
  try{if(localStorage.getItem(syncKey)==='1')return true}catch(e){}
  try{
    const agg={s:{b:0,s:0,t:0},t:{b:0,s:0,t:0},u:{b:0,s:0,t:0}};
    const hs=await db.collection('hasil').where('uid','==',user.uid).limit(1000).get();
    hs.docs.forEach(doc=>{
      const x=doc.data()||{},k=v21Kind(x);if(!agg[k])return;
      const ok=Math.max(0,Math.round(+x.skor||0)),total=Math.max(0,Math.round(+x.total||0));
      agg[k].b+=ok;agg[k].s+=Math.max(0,total-ok);agg[k].t+=total;
    });
    const ref=db.collection('papan').doc(user.uid);
    const done=await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);if(!snap.exists)return false;
      const cur=snap.data()||{},patch={};
      ['s','t','u'].forEach(k=>{
        const b=Math.max(0,+cur[k+'Benar']||0,agg[k].b),s=Math.max(0,+cur[k+'Salah']||0,agg[k].s),t=Math.max(0,+cur[k+'Total']||0,agg[k].t);
        if(b!==(+cur[k+'Benar']||0))patch[k+'Benar']=b;
        if(s!==(+cur[k+'Salah']||0))patch[k+'Salah']=s;
        if(t!==(+cur[k+'Total']||0))patch[k+'Total']=t;
      });
      if(Object.keys(patch).length){patch.uid=user.uid;tx.set(ref,patch,{merge:true})}
      return true;
    });
    if(!done)return false;
    try{localStorage.setItem(syncKey,'1')}catch(e){}
    return true;
  }catch(e){console.warn('V21 rekap hasil:',e.message);return false}
}
async function v21BoardList(n,cat){
  if(!db)return null;
  try{
    const s=await db.collection('papan').limit(250).get();
    const l=s.docs.map(d=>d.data()).filter(x=>x&&x.uid);
    l.sort((a,b)=>v21Cmp(a,b,cat||v21BoardCat));
    return l.slice(0,n||20);
  }catch(e){console.warn('V21 papan:',e.message);return null}
}
async function v21MiniBoard(){
  const el=$('v21mini');if(!el)return;
  const req=++v21MiniReq;
  const l=await v21BoardList(5,v21BoardCat);if(req!==v21MiniReq||!el.isConnected)return;
  if(!l){el.innerHTML='<div class="warn small">Papan peringkat belum aktif. Pastikan aturan Firestore terbaru sudah dipasang.</div>';return}
  if(!l.length){el.innerHTML='<div class="mut small">Belum ada peserta. Selesaikan latihan pertamamu!</div>';return}
  const me=user&&user.uid;
  el.innerHTML=l.map((x,i)=>{
    const st=v21Stat(x,v21BoardCat);
    return '<div class="v21-rank '+(x.uid===me?'me':'')+'"><span class="v21-pos">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</span><div class="v21-nm">'+esc(x.nama||'Siswa')+(x.uid===me?' <i>(kamu)</i>':'')+'<div class="v21-stat">✅ <b>'+st.b+'</b> benar • ❌ <b>'+st.s+'</b> salah • '+v21Acc(st)+'%</div></div><span class="v21-xp">'+(x.xp||0)+'<div class="mut small">XP</div></span></div>';
  }).join('');
}

/* ---------- Beranda ---------- */
function pBeranda(){
  const a=v21Act(),st=v21Streak(a),tg=v21Target(),t=v21Today(a),w=v21Week(a);
  const days=Object.values(a.days),sum=days.reduce((s,x)=>s+(x.n||0),0),ok=days.reduce((s,x)=>s+(x.ok||0),0);
  const acc=sum?Math.round(ok/sum*100):0,pct=Math.min(100,Math.round((t.n||0)/tg*100)),maxN=Math.max(1,...w.map(x=>x.n));
  const nm=((user&&(user.displayName||user.email))||'Siswa').split(' ')[0];
  $('pane').innerHTML='<div class="card v21-hero"><div class="v21-hero-top"><div style="flex:1;min-width:0">'
    +'<div class="mut small">Selamat datang, '+esc(nm)+' 👋</div>'
    +'<div class="v21-hero-title">'+(t.n>=tg?'Target hari ini tercapai! 🎉':'Ayo kejar target hari ini')+'</div>'
    +'<div class="v21-chips"><span class="chip">🔥 '+st+' hari</span><span class="chip">⚡ '+a.xp+' XP</span><span class="chip">🎯 '+acc+'% akurasi</span></div></div>'
    +'<div class="ring" style="--p:'+pct+'"><div class="ring-in"><b>'+t.n+'</b><span>/'+tg+'</span></div></div></div>'
    +'<div class="v21-actions"><button class="btn" onclick="v21Go(\'latihan\')">🎯 Latihan</button><button class="btn alt" onclick="v21Go(\'tryout\')">⏱ Tryout</button><button class="btn alt" onclick="v21Go(\'tutor\')">🤖 Tutor</button></div>'
    +'<div class="v21-target"><span class="mut small">Target harian</span><select onchange="v21SetTarget(this.value)">'+[10,20,30,50,100].map(n=>'<option value="'+n+'"'+(n===tg?' selected':'')+'>'+n+' soal</option>').join('')+'</select></div></div>'
    +'<div class="card"><h3>📈 7 hari terakhir</h3><div class="v21-bars">'
    +w.map(x=>'<div class="v21-bar" title="'+x.n+' soal"><i style="height:'+Math.max(6,Math.round(x.n/maxN*100))+'%"></i><span>'+x.lbl+'</span></div>').join('')
    +'</div><div class="mut small" style="margin-top:10px">'+sum+' soal total • '+ok+' benar • streak terbaik '+(a.best||st)+' hari</div></div>'
    +'<div class="card"><div class="v21-board-head"><h3>🏆 Peringkat</h3><button class="x" onclick="v21Go(\'papan\')">Semua ›</button></div>'
    +v21CatButtons()+'<div class="mut small" style="margin:2px 0 8px">Pilih kategori. Semua akun Google yang aktif ikut peringkat.</div><div id="v21mini" class="mut small">Memuat...</div></div>';
  v21MiniBoard();
}
function v21Go(tab){S.sec='sekolah';S.tab=tab;home()}
function v21Home(){S.sec='beranda';home()}

/* ---------- Tryout berwaktu ---------- */
function pTryout(){
  const J=[10,20,30,40],D=[15,30,45,60,90];
  $('pane').innerHTML='<div class="card"><h3>⏱ Tryout — '+esc(S.mapel)+'</h3>'
    +'<div class="mut small">Simulasi ujian TKA: timer berjalan, bebas pindah soal, jawaban dinilai setelah dikumpulkan.</div>'
    +'<div class="v21-grid2" style="margin-top:12px"><div><label>Jumlah soal</label><select id="tn">'+J.map(n=>'<option value="'+n+'"'+(n===20?' selected':'')+'>'+n+' soal</option>').join('')+'</select></div>'
    +'<div><label>Durasi</label><select id="td">'+D.map(n=>'<option value="'+n+'"'+(n===60?' selected':'')+'>'+n+' menit</option>').join('')+'</select></div></div>'
    +'<button class="btn full" onclick="startTryout()">Mulai tryout ▶</button><div id="tmsg" class="mut small" style="margin-top:10px"></div></div>'
    +'<div class="card"><h3>📋 Tips</h3><div class="mut small">1) Kerjakan soal mudah dulu, tandai yang ragu dengan 🚩.<br>2) Waktu habis = otomatis dikumpulkan.<br>3) Soal diambil dari bank soal pelajaran ini — buat soal dulu bila bank masih kosong.</div></div>';
}
async function startTryout(){
  const n=+((($('tn')||{}).value)||20),d=+((($('td')||{}).value)||60);
  setTxt('tmsg','Menyiapkan paket tryout...');
  try{
    S.sub='';S.jenis='';S.lvl='';S.fresh=true;
    const qs=await loadQs2(n);
    if(!qs.length){setTxt('tmsg','Bank soal kosong. Buat soal dulu di tab ✨ Soal, atau pakai 🎯 Latihan.');return}
    if(qs.length<n)v21Toast('Hanya tersedia '+qs.length+' soal');
    initRun(qs,true,false);
    S.left=d*60;S.tryout21=true;startTimer();
    const t=$('tmr');if(t)t.textContent=fmtT(S.left);
    saveProg();
  }catch(e){setTxt('tmsg','Gagal: '+e.message)}
}

/* ---------- Papan peringkat ---------- */
async function pPapan(){
  const req=++v21PapanReq,label=v21CatLabel(v21BoardCat);
  $('pane').innerHTML='<div class="card"><div class="v21-board-head"><h3>🏆 Peringkat '+label+'</h3><button class="x" onclick="pPapan()">🔄</button></div>'
    +'<div class="mut small">Diurutkan dari jumlah jawaban benar. Akun Google yang sudah aktif otomatis masuk peringkat.</div>'
    +v21CatButtons()
    +'<div id="v21board" class="mut small" style="margin-top:12px">Memuat...</div></div>'
    +'<div class="card"><h3>📊 Statistikku</h3><div id="v21mine" class="mut small">Memuat...</div></div>';
  const a=v21Act(),st=v21Streak(a),t=v21Today(a),days=Object.values(a.days);
  const sum=days.reduce((s,x)=>s+(x.n||0),0),ok=days.reduce((s,x)=>s+(x.ok||0),0);
  const mine=$('v21mine');
  if(mine)mine.innerHTML='<div class="item"><span>🔥 Streak</span><b>'+st+' hari</b></div><div class="item"><span>⚡ XP</span><b>'+a.xp+'</b></div><div class="item"><span>🎯 Hari ini</span><b>'+t.n+' / '+v21Target()+' soal</b></div><div class="item"><span>📈 7 hari</span><b>'+v21WeekSum(a)+' soal</b></div><div class="item"><span>✅ Akurasi total</span><b>'+(sum?Math.round(ok/sum*100):0)+'%</b></div>';
  const all=await v21BoardList(250,v21BoardCat),b=$('v21board');if(req!==v21PapanReq||!b||!b.isConnected)return;
  if(!all){b.innerHTML='<div class="warn">Belum bisa memuat papan peringkat. Pastikan aturan Firestore terbaru sudah dipasang.</div>';return}
  const l=all.slice(0,50),me=user&&user.uid,mineRow=all.find(x=>x.uid===me);
  if(mine&&mineRow){const ms=v21Stat(mineRow,v21BoardCat);mine.insertAdjacentHTML('afterbegin','<div class="item"><span>'+label+'</span><b>✅ '+ms.b+' benar • ❌ '+ms.s+' salah</b></div>')}
  if(!l.length){b.innerHTML='<div class="mut small">Belum ada peserta.</div>';return}
  b.innerHTML=l.map((x,i)=>{
    const s=v21Stat(x,v21BoardCat);
    return '<div class="v21-rank '+(x.uid===me?'me':'')+'"><span class="v21-pos">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</span><div class="v21-nm">'+esc(x.nama||'Siswa')+(x.uid===me?' <i>(kamu)</i>':'')+'<div class="v21-stat">✅ <b>'+s.b+'</b> benar • ❌ <b>'+s.s+'</b> salah • '+v21Acc(s)+'%</div><div class="mut small">🔥 '+(x.streak||0)+' hari • '+(x.minggu||0)+' soal/7 hari</div></div><span class="v21-xp">'+(x.xp||0)+'<div class="mut small">XP</div></span></div>';
  }).join('');
}

inyal entry/SL/TP. Emas sangat sensitif terhadap yield riil, USD, dan posisi pasar; hasil rilis bisa berbeda dari skenario mana pun.</div>`;

/* ---------- riwayat analisis XAUUSD (maks 5, bisa dibuka & dihapus) ---------- */
const XHKEY='xau_hist_v1',XHMAX=5;
function xauHist(){
  try{const a=JSON.parse(localStorage.getItem(XHKEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&x.j&&x.j.xai):[]}catch(e){return[]}
}
function xauHistSave(j){
  if(!j||!j.xai)return;
  const id=String(j.fetchedAt||'');
  let h=xauHist().filter(x=>String((x.j&&x.j.fetchedAt)||'')!==id);
  h.unshift({ts:Date.now(),j});
  for(const n of [XHMAX,3,1]){
    try{localStorage.setItem(XHKEY,JSON.stringify(h.slice(0,n)));return}catch(e){}
  }
}
function xauHistPaint(){
  const el=$('xhist');if(!el)return;
  const h=xauHist();
  if(!h.length){el.innerHTML='';return}
  el.innerHTML=`<div class="card"><div class="v21-board-head"><h3>🗂 Riwayat analisis</h3><button class="x" onclick="xauHistClear()">Hapus semua</button></div><div class="mut small" style="margin-bottom:6px">Tersimpan di perangkat ini (maks ${XHMAX}). Buka kembali tanpa mengambil data baru.</div>${h.map((it,i)=>{
    const j=it.j,x=j.xai||{},b=x.bias||{},t=new Date(j.fetchedAt||it.ts),bi=b.bias||'NETRAL',act=x.action||(bi==='BULLISH'?'BUY':bi==='BEARISH'?'SELL':'WAIT');

    return `<div class="item" style="align-items:center;gap:8px"><div style="min-width:0"><div><b>${ic} ${esc(act)} XAU</b> <span class="small mut">${esc(bi)} · ${esc(b.confidence||'RENDAH')}</span></div><div class="small mut">${esc(t.toLocaleString('id-ID'))} · ${esc(j.provider||'-')}${j.model?' · '+esc(String(j.model).slice(0,28)):''}</div></div><div style="display:flex;gap:6px;flex:none"><button class="x" onclick="xauHistOpen(${i})">Buka</button><button class="x" onclick="xauHistDel(${i})" aria-label="Hapus riwayat ini" title="Hapus">🗑</button></div></div>`;
  }).join('')}</div>`;
}
function xauHistOpen(i){

function xauHistDel(i){
  const h=xauHist();if(!h[i])return;

}
function xauHistClear(){
  if(!xauHist().length)return;

table{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
