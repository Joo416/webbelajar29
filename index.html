<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Belajar</title>
<style>
:root{--bg:#0f1226;--card:#1a1e3a;--line:#2b3160;--tx:#eef0ff;--mut:#9aa3d6;--a:#7c8cff;--b:#3ddbb0;--bad:#ff6b8a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:radial-gradient(1000px 500px at 10% -10%,#2a2f6b 0,transparent 60%),radial-gradient(800px 400px at 100% 0,#13524a 0,transparent 55%),var(--bg);min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:6px 0 2px}.sub{color:var(--mut);font-size:.9rem;margin-bottom:18px}
.tabs,.stabs{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px}
.tabs button,.stabs button{flex:1;padding:10px 4px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:600;font-size:.88rem;cursor:pointer}
.tabs button.on,.stabs button.on{background:linear-gradient(135deg,var(--a),#a07cff);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 30px #0004}
.card h3{margin:0 0 12px;font-size:1rem}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 5px}
select,textarea,input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#12152e;color:var(--tx);font:inherit}
input[type=checkbox]{width:18px;height:18px;margin-top:3px}
textarea{min-height:90px;resize:vertical;font-size:.88rem}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{padding:12px 16px;border:0;border-radius:12px;font-weight:700;cursor:pointer;color:#06231c;background:linear-gradient(135deg,var(--b),#7cf0d0);font-size:.95rem}
.btn.alt{background:#262b55;color:var(--tx)}.btn.red{background:#4a1a2c;color:#ffb3c4}.btn.full{width:100%;margin-top:14px}
.bar{height:8px;background:#12152e;border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.q{font-size:1.1rem;line-height:1.5;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:9px;border-radius:12px;border:1.5px solid var(--line);background:#12152e;color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--a)}.opt.ok{border-color:var(--b);background:#12352f}.opt.no{border-color:var(--bad);background:#3a1626}
.exp{margin-top:12px;padding:12px;border-radius:12px;background:#12152e;color:var(--mut);font-size:.9rem;line-height:1.5}
.big{font-size:3rem;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}.item:last-child{border:0}
.mut{color:var(--mut)}.small{font-size:.85rem}
.warn{background:#3a2a10;border:1px solid #7a5a1a;color:#ffd48a;padding:12px;border-radius:12px;font-size:.85rem;margin-bottom:14px}
.note{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;white-space:pre-wrap}
#chat{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.msg{padding:11px 13px;border-radius:14px;font-size:.92rem;line-height:1.55;max-width:92%}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--a),#a07cff);color:#fff}
.msg.assistant{align-self:flex-start;background:#12152e;border:1px solid var(--line)}
.gi{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.5}
.gi>div{flex:1}.x{border:0;background:#4a1a2c;color:#ffb3c4;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
</head>
<body>
<div class="wrap">
  <h1>📖 Ruang Belajar</h1>
  <div class="sub">TKA, pelajaran sekolah, dan trading dengan tutor AI</div>
  <div id="warn"></div>
  <div id="userbar"></div>
  <div class="tabs">
    <button id="t-sekolah" onclick="setSec('sekolah')">🎓 TKA & Sekolah</button>
    <button id="t-trading" onclick="setSec('trading')">📈 Trading</button>
  </div>
  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKv_cb50KmpAPv8qxVGspsFQPWPT7Ym2w",
  authDomain: "ruangbelajar-8584c.firebaseapp.com",
  projectId: "ruangbelajar-8584c",
  storageBucket: "ruangbelajar-8584c.firebasestorage.app",
  messagingSenderId: "645886662774",
  appId: "1:645886662774:web:754d8425ed0df42f11a757"
};

const MAPEL={
  sekolah:['Bahasa Indonesia','Matematika','IPA','IPS','Bahasa Inggris','Umum (Trivia Dunia)'],
  trading:['SMC / ICT','Price Action','Risk Management','Psikologi Trading']
};
const LEVEL={
  sekolah:['SD kelas 4-6','SMP','SMA','TKA / UTBK','Umum'],
  trading:['Pemula','Menengah','Lanjut']
};
const SAMPLE=[
  {kategori:'sekolah',mapel:'Matematika',q:'Hasil dari 3/4 + 1/8 adalah ...',o:['7/8','4/12','1','5/8'],a:0,e:'3/4 = 6/8, jadi 6/8 + 1/8 = 7/8.'},
  {kategori:'sekolah',mapel:'Bahasa Indonesia',q:'Kata baku yang tepat adalah ...',o:['Apotik','Apotek','Aphotek','Apotex'],a:1,e:'Menurut KBBI bentuk bakunya apotek.'},
  {kategori:'trading',mapel:'SMC / ICT',q:'Order Block bullish biasanya adalah ...',o:['Candle bullish terakhir sebelum jatuh','Candle bearish terakhir sebelum kenaikan impulsif','Gap di tengah trend','Equal high'],a:1,e:'OB bullish = candle bearish terakhir sebelum pergerakan naik impulsif.'},
  {kategori:'trading',mapel:'Risk Management',q:'Risiko per trade yang umum disarankan?',o:['10-20%','5-10%','1-2%','Semua saldo'],a:2,e:'Banyak trader membatasi risiko 1-2% ekuitas per trade.'}
];

let db=null,auth=null,user=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth=firebase.auth()}catch(e){console.error(e);document.getElementById('warn').innerHTML='<div class="warn">⚠️ Firebase gagal dimuat.</div>'}

const S={sec:'sekolah',mapel:'Bahasa Indonesia',tab:'latihan',qs:[],i:0,score:0,done:false,chat:{},gen:[],bank:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[\[(.+?)\|(https?:[^\]\s]+)\]\]/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--b)">$1</a>').replace(/\n/g,'<br>');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const isUmum=()=>S.mapel.startsWith('Umum');

async function ai(system,messages,big){
  const tk=await user.getIdToken();
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({system,messages,big:!!big})});
  let j;try{j=await r.json()}catch(e){throw new Error('AI hanya aktif setelah web dibuka dari Vercel (bukan file lokal).')}
  if(!r.ok) throw new Error(j.error||'AI gagal');
  return j.text;
}

function setSec(s){S.sec=s;S.mapel=MAPEL[s][0];S.tab='latihan';home()}
function home(){
  ['sekolah','trading'].forEach(k=>$('t-'+k).classList.toggle('on',S.sec===k));
  const T=[['latihan','🎯 Latihan'],['tutor','🤖 Tutor AI'],['buat','✨ Buat Soal'],['bank','🗂 Bank Soal']];
  $('app').innerHTML=`<div class="card"><label style="margin-top:0">Pelajaran / topik</label>
    <select onchange="S.mapel=this.value;S.gen=[];pane()">${MAPEL[S.sec].map(m=>`<option ${m===S.mapel?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="stabs">${T.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';home()">${l}</button>`).join('')}</div>
    <div id="pane"></div>`;
  pane();
}
function pane(){({latihan:pLatihan,tutor:pTutor,buat:pBuat,bank:pBank})[S.tab]()}

/* ---------- LATIHAN ---------- */
function pLatihan(){
  $('pane').innerHTML=`<div class="card"><h3>Mulai latihan: ${esc(S.mapel)}</h3>
    <label>Jumlah soal</label><select id="n"><option>5</option><option selected>10</option><option>25</option><option>50</option></select>
    <button class="btn full" onclick="start()">Mulai ▶</button><div id="msg" class="mut small" style="margin-top:10px"></div></div>
  ${S.sec==='trading'?`<div class="card"><h3>📝 Catatan trading</h3>
    <textarea id="cat" placeholder="Catatan setup, pelajaran, evaluasi..."></textarea>
    <button class="btn alt full" onclick="saveNote()">Simpan catatan</button><div id="notes"></div></div>`:''}
  <div class="card"><h3>🏆 Riwayat</h3><div id="hist" class="mut">Memuat...</div></div>`;
  loadHist();if(S.sec==='trading')loadNotes();
}
async function loadQs(n){
  if(isUmum()){
    const r=await fetch(`https://opentdb.com/api.php?amount=${Math.min(n,50)}&type=multiple`);const j=await r.json();
    return j.results.map(x=>{const o=shuffle([x.correct_answer,...x.incorrect_answers]).map(dec);return{q:dec(x.question),o,a:o.indexOf(dec(x.correct_answer)),e:'Jawaban benar: '+dec(x.correct_answer)}});
  }
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
  return shuffle(s.docs.map(d=>d.data())).slice(0,n);
}
async function start(){
  ($('msg')||{}).textContent='Memuat soal...';
  try{const qs=await loadQs(+$('n').value);
    if(!qs.length){($('msg')||{}).textContent='Belum ada soal. Buat lewat tab ✨ Buat Soal atau 🗂 Bank Soal.';return}
    Object.assign(S,{qs,i:0,score:0});show();
  }catch(e){($('msg')||{}).textContent='Gagal: '+e.message}
}
function show(){
  if(S.i>=S.qs.length) return finish();
  const q=S.qs[S.i];S.done=false;
  $('app').innerHTML=`<div class="card"><div class="mut small" style="margin-bottom:8px">${esc(S.mapel)} • Soal ${S.i+1}/${S.qs.length}</div>
    <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="q">${esc(q.q)}</div>
    ${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join('')}<div id="fb"></div></div>`;
}
function pick(k){
  if(S.done)return;S.done=true;const q=S.qs[S.i],bs=document.querySelectorAll('.opt');
  bs.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok')});
  if(k===q.a)S.score++;else bs[k].classList.add('no');
  $('fb').innerHTML=`${q.e?`<div class="exp">💡 ${esc(q.e)}</div>`:''}
    <div id="aiexp"></div>
    <div class="row" style="margin-top:12px"><button class="btn alt" onclick="explain(${k})">🤖 Jelaskan lebih detail</button><button class="btn" onclick="S.i++;show()">${S.i+1<S.qs.length?'Lanjut ▶':'Hasil'}</button></div>`;
}
async function explain(k){
  const q=S.qs[S.i];($('aiexp')||{}).innerHTML='<div class="exp">⏳ Tutor AI menjelaskan...</div>';
  try{const t=await ai(tutorSys(),[{role:'user',content:`Jelaskan langkah demi langkah kenapa jawaban soal ini benar, dan kenapa pilihan saya (${String.fromCharCode(65+k)}) ${k===q.a?'sudah benar':'salah'}.\nSoal: ${q.q}\nPilihan: ${q.o.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join(' | ')}\nJawaban benar: ${String.fromCharCode(65+q.a)}`}]);
    ($('aiexp')||{}).innerHTML=`<div class="exp">${fmt(t)}</div>`;
  }catch(e){($('aiexp')||{}).innerHTML=`<div class="exp">⚠️ ${esc(e.message)}</div>`}
}
async function finish(){
  const t=S.qs.length,p=Math.round(S.score/t*100);
  $('app').innerHTML=`<div class="card"><div class="big">${p}</div><div style="text-align:center" class="mut">Benar ${S.score} dari ${t} • ${esc(S.mapel)}</div><button class="btn full" onclick="home()">Kembali</button></div>`;
  try{await db.collection('hasil').add({uid:user.uid,kategori:S.sec,mapel:S.mapel,skor:S.score,total:t,waktu:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.error(e)}
}
async function loadHist(){
  try{const s=await db.collection('hasil').where('uid','==',user.uid).limit(100).get();
    const r=s.docs.map(d=>d.data()).filter(x=>x.kategori===S.sec).sort((a,b)=>(b.waktu?.seconds||0)-(a.waktu?.seconds||0)).slice(0,8);
    ($('hist')||{}).innerHTML=r.length?r.map(x=>`<div class="item"><span>${esc(x.mapel)}</span><b>${x.skor}/${x.total}</b></div>`).join(''):'Belum ada riwayat.';
  }catch(e){($('hist')||{}).textContent='Gagal memuat riwayat.'}
}
async function saveNote(){const v=$('cat').value.trim();if(!v)return;await db.collection('catatan').add({uid:user.uid,teks:v,waktu:firebase.firestore.FieldValue.serverTimestamp()});$('cat').value='';loadNotes()}
async function loadNotes(){const s=await db.collection('catatan').where('uid','==',user.uid).limit(50).get();const r=s.docs.map(d=>d.data()).sort((a,b)=>(b.waktu?.seconds||0)-(a.waktu?.seconds||0)).slice(0,8);($('notes')||{}).innerHTML=r.map(x=>`<div class="note">${esc(x.teks)}</div>`).join('')}

/* ---------- TUTOR AI ---------- */
function tutorSys(){
  return S.sec==='trading'
   ?`Kamu tutor ${S.mapel} untuk edukasi trading forex. Jawab dalam Bahasa Indonesia, jelas, bertahap, dengan contoh. Ini edukasi, bukan saran finansial; ingatkan risiko bila relevan.`
   :`Kamu tutor ${isUmum()?'pengetahuan umum':S.mapel} untuk siswa Indonesia (level sekolah sampai TKA). Jawab dalam Bahasa Indonesia, jelas, bertahap, ringkas, dengan contoh. Jika siswa salah, koreksi dengan sopan. Jangan mengarang fakta; jika ragu, katakan.`;
}
function pTutor(){
  $('pane').innerHTML=`<div class="card"><h3>🤖 Tutor ${esc(S.mapel)}</h3><div id="chat"></div>
    <div class="row" style="margin-top:12px"><input id="ci" placeholder="Tanya materi, minta contoh, atau minta dijelaskan..." onkeydown="if(event.key==='Enter')send()"><button class="btn" style="flex:0 0 auto" onclick="send()">Kirim</button></div>
    <button class="btn alt full" style="margin-top:8px" onclick="S.chat[S.mapel]=[];drawChat()">Hapus percakapan</button></div>`;
  drawChat();
}
function drawChat(){
  const c=S.chat[S.mapel]||[];
  $('chat').innerHTML=c.length?c.map(m=>`<div class="msg ${m.role}">${fmt(m.content)}</div>`).join(''):'<div class="mut small">Tanyakan apa saja tentang materi ini. Contoh: "jelaskan pecahan dengan contoh" atau "kasih trik cepat mengerjakan soal ini".</div>';
  $('chat').scrollTop=1e9;
}
async function send(){
  const v=$('ci').value.trim();if(!v)return;$('ci').value='';
  const c=S.chat[S.mapel]=S.chat[S.mapel]||[];c.push({role:'user',content:v},{role:'assistant',content:'⏳ Berpikir...'});drawChat();
  let h=c.slice(0,-1).filter(m=>!m.content.startsWith('⚠️')).slice(-12);while(h.length&&h[0].role!=='user')h.shift();
  try{c[c.length-1].content=await ai(tutorSys(),h)}catch(e){c[c.length-1].content='⚠️ '+e.message}
  if($('chat'))drawChat();
}

/* ---------- BUAT SOAL (AI) ---------- */
function pBuat(){
  if(isUmum()){$('pane').innerHTML='<div class="card mut">Topik Trivia Dunia mengambil soal otomatis dari internet. Pilih pelajaran lain untuk membuat soal dengan AI.</div>';return}
  $('pane').innerHTML=`<div class="card"><h3>✨ Buat soal ${esc(S.mapel)} dengan AI</h3>
    <label>Topik / materi spesifik</label><input id="gt" placeholder="${S.sec==='trading'?'contoh: Order Block, Fair Value Gap, BOS vs CHoCH':'contoh: pecahan, kalimat efektif, hukum Newton'}">
    <div class="row"><div><label>Jumlah soal</label><select id="gn"><option>5</option><option selected>10</option><option>20</option><option>25</option></select></div>
    <div><label>Tingkat</label><select id="gl">${LEVEL[S.sec].map(l=>`<option>${l}</option>`).join('')}</select></div>
    <div><label>Kesulitan</label><select id="gd"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option><option>Campuran</option></select></div></div>
    <label>Instruksi khusus (opsional, makin jelas makin tepat)</label>
    <textarea id="gx" placeholder="contoh: soal cerita sehari-hari, hindari soal hitungan panjang, pilihan pengecoh harus masuk akal, sertakan pembahasan langkah demi langkah"></textarea>
    <button class="btn full" id="gb" onclick="gen()">Buat soal ✨</button><div id="gm" class="mut small" style="margin-top:10px"></div></div>
    <div id="gres"></div>`;
  drawGen();
}
function cleanOpt(s){return String(s).replace(/^\s*[A-Da-d][.)]\s+/,'')}
function normQ(x){
  if(!x||!x.q||!Array.isArray(x.o)||x.o.length<2||!Number.isInteger(x.a)||x.a<0||x.a>=x.o.length)return null;
  const o0=x.o.map(cleanOpt),c=o0[x.a],o=shuffle(o0);return{q:String(x.q),o,a:o.indexOf(c),e:x.e?String(x.e):''};
}
async function gen(){
  const topik=$('gt').value.trim();if(!topik){($('gm')||{}).textContent='Isi topik dulu.';return}
  const n=+$('gn').value,lv=$('gl').value,df=$('gd').value,ex=$('gx').value.trim(),parts=[];
  for(let l=n;l>0;l-=10)parts.push(Math.min(10,l));
  const sys=`Kamu pembuat soal pilihan ganda ${S.mapel} untuk ${S.sec==='trading'?'edukasi trading forex':'siswa Indonesia'}. Keluarkan HANYA JSON array valid tanpa teks lain dan tanpa markdown. Tiap item: {"q":"pertanyaan","o":["opsi1","opsi2","opsi3","opsi4"],"a":indeks_jawaban_benar_0_sampai_3,"e":"pembahasan singkat langkah demi langkah"}. Aturan: soal jelas dan tidak ambigu, tepat satu jawaban benar, fakta akurat, Bahasa Indonesia, opsi tanpa awalan huruf, pengecoh masuk akal, tidak ada soal ganda/duplikat. Rumus matematika ditulis LaTeX di antara \\( dan \\); semua backslash di dalam JSON wajib digandakan.`;
  ($('gb')||{}).disabled=true;($('gm')||{}).textContent=`⏳ AI sedang membuat ${n} soal...`;
  try{
    const out=await Promise.all(parts.map((c,i)=>ai(sys,[{role:'user',content:`Buat ${c} soal.\nMapel: ${S.mapel}\nTopik: ${topik}\nTingkat: ${lv}\nKesulitan: ${df}\n${parts.length>1?`Ini bagian ${i+1} dari ${parts.length}; variasikan sub-topik agar tidak sama dengan bagian lain.\n`:''}${ex?'Instruksi khusus: '+ex:''}`}],true)));
    let all=[];
    out.forEach(t=>{const m=t.match(/\[[\s\S]*\]/);if(m)try{all=all.concat(JSON.parse(m[0].replace(/\\(["\\/bfnrtu])|\\/g,(a,g)=>g?a:"\\\\")).map(normQ).filter(Boolean))}catch(e){}});
    S.gen=all;($('gm')||{}).textContent=all.length?`✅ ${all.length} soal siap. Periksa dulu, hapus yang salah (✕), lalu simpan.`:'AI tidak mengembalikan soal yang valid. Coba lagi.';
  }catch(e){($('gm')||{}).textContent='⚠️ '+e.message}
  ($('gb')||{}).disabled=false;drawGen();
}
function drawGen(){
  if(!$('gres'))return;
  ($('gres')||{}).innerHTML=S.gen.length?`<div class="card"><h3>Pratinjau (${S.gen.length})</h3>${S.gen.map((x,i)=>`<div class="gi"><input type="checkbox" id="g${i}" checked><div><b>${i+1}. ${esc(x.q)}</b><div class="mut">${x.o.map((o,k)=>(k===x.a?'✅ ':'• ')+esc(o)).join('<br>')}</div><div class="mut">💡 ${esc(x.e)}</div></div><button class="x" onclick="S.gen.splice(${i},1);drawGen()">✕</button></div>`).join('')}<button class="btn full" onclick="saveGen()">💾 Simpan yang dicentang ke Bank Soal</button></div>`:'';
}
async function saveGen(){
  const sel=S.gen.filter((x,i)=>$('g'+i)&&$('g'+i).checked);if(!sel.length)return alert('Tidak ada soal dicentang');

  $('pane').innerHTML=`<div class="card"><h3>🗂 Bank soal: ${esc(S.mapel)}</h3><div id="bl" class="mut">Memuat...</div></div>

async function loadBank(){
  try{const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
    S.bank=s.docs.map(d=>({id:d.id,...d.data()}));drawBank();
  }catch(e){($('bl')||{}).textContent='Gagal memuat: '+e.message}
}
function drawBank(){
  ($('bl')||{}).innerHTML=S.bank.length?`<div class="small" style="margin-bottom:8px">${S.bank.length} soal</div>`+S.bank.map(x=>`<div class="gi"><div><b>${esc(x.q)}</b><div class="mut small">✅ ${esc(x.o[x.a])} ${x.sumber==='ai'?'• 🤖 AI':''}</div></div><button class="x" onclick="del('${x.id}')">🗑</button></div>`).join('')+`<button class="btn red full" onclick="delAll()">Hapus semua soal ${esc(S.mapel)}</button>`:'Belum ada soal. Buat dengan ✨ Buat Soal atau tambah manual.';
}
async function del(id){if(!confirm('Hapus soal ini?'))return;await db.collection('soal').doc(id).delete();S.bank=S.bank.filter(x=>x.id!==id);drawBank()}
async function delAll(){
  if(!confirm(`Hapus SEMUA ${S.bank.length} soal ${S.mapel}? Tidak bisa dibatalkan.`))return;
  for(let i=0;i<S.bank.length;i+=20){const b=db.batch();S.bank.slice(i,i+20).forEach(x=>b.delete(db.collection('soal').doc(x.id)));await b.commit()}
  S.bank=[];drawBank();
}
async function importQ(){
  let arr;try{arr=JSON.parse($('imp').value)}catch(e){return alert('JSON tidak valid')}
  if(!Array.isArray(arr))return alert('Harus berupa array');
  const ok=arr.filter(x=>x.q&&Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length);
  for(let i=0;i<ok.length;i+=20){const b=db.batch();ok.slice(i,i+20).forEach(x=>b.set(db.collection('soal').doc(),{q:x.q,o:x.o,a:x.a,e:x.e||'',uid:user.uid,kategori:S.sec,mapel:S.mapel}));await b.commit()}
  alert(`${ok.length} soal tersimpan (${arr.length-ok.length} dilewati)`);pBank();
}
async function seed(){
  const b=db.batch();SAMPLE.filter(x=>x.kategori===S.sec&&x.mapel===S.mapel).forEach(x=>b.set(db.collection('soal').doc(),{...x,uid:user.uid}));await b.commit();pBank();
}

/* ---- Latihan, ujian, review, statistik ---- */
function pLatihan(){
  $('pane').innerHTML=`<div class="card"><h3>Mulai latihan: ${esc(S.mapel)}</h3>
    ${isUmum()?'':`<label>Subtopik (opsional)</label><input id="sub" placeholder="kosong = semua, contoh: pecahan" value="${esc(S.sub||'')}">`}
    <label>Jumlah soal</label><select id="n"><option>5</option><option selected>10</option><option>25</option><option>50</option></select>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="ex" style="width:18px"> Mode ujian (timer, pembahasan setelah selesai)</label>
    <button class="btn full" onclick="start()">Mulai ▶</button><div id="msg" class="mut small" style="margin-top:10px"></div></div>
    <div class="card"><h3>📊 Statistik</h3><div id="stat" class="mut">Memuat...</div></div>
    <div class="card"><h3>🏆 Riwayat</h3><div id="hist" class="mut">Memuat...</div></div>`;
  loadHist();
}
async function loadQs2(n){
  if(isUmum())return loadQs(n);
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
  let a=s.docs.map(d=>d.data()),sub=(S.sub||'').toLowerCase();
  if(sub)a=a.filter(x=>(x.sub||'').toLowerCase().includes(sub));
  return shuffle(a).slice(0,n);
}
async function start(){
  S.sub=$('sub')?$('sub').value.trim():'';S.exam=$('ex').checked;S.retry=false;($('msg')||{}).textContent='Memuat soal...';
  try{const qs=await loadQs2(+$('n').value);
    if(!qs.length){($('msg')||{}).textContent='Tidak ada soal (cek subtopik atau buat soal dulu).';return}
    Object.assign(S,{qs,i:0,score:0,wrong:[]});clearInterval(S.tm);
    if(S.exam){S.left=Math.ceil(qs.length*90);S.tm=setInterval(()=>{S.left--;const e=$('tmr');if(e)e.textContent=fmtT(S.left);if(S.left<=0)finish()},1000)}
    show();
  }catch(e){($('msg')||{}).textContent='Gagal: '+e.message}
}
function retry(){Object.assign(S,{qs:shuffle(S.wrong.map(({pick,...q})=>q)),i:0,score:0,wrong:[],exam:false,retry:true});show()}
function show(){
  if(S.i>=S.qs.length)return finish();
  const q=S.qs[S.i];S.done=false;
  $('app').innerHTML=`<div class="card"><div class="mut small" style="margin-bottom:8px;display:flex;justify-content:space-between"><span>${esc(S.mapel)} • Soal ${S.i+1}/${S.qs.length}</span>${S.exam?`<b id="tmr">${fmtT(S.left)}</b>`:''}</div>
    <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="q">${esc(q.q)}</div>
    ${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${String.fromCharCode(65+k)}. ${esc(o)}</button>`).join('')}<div id="fb"></div></div>`;
}
function pick(k){
  if(S.done)return;S.done=true;const q=S.qs[S.i];
  if(k===q.a)S.score++;else S.wrong.push({...q,pick:k});
  if(S.exam){S.i++;return show()}
  const bs=document.querySelectorAll('.opt');bs.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok')});if(k!==q.a)bs[k].classList.add('no');
  $('fb').innerHTML=`${q.e?`<div class="exp">💡 ${esc(q.e)}</div>`:''}<div id="aiexp"></div>
    <div class="row" style="margin-top:12px"><button class="btn alt" onclick="explain(${k})">🤖 Jelaskan lebih detail</button><button class="btn" onclick="S.i++;show()">${S.i+1<S.qs.length?'Lanjut ▶':'Hasil'}</button></div>`;
}
async function finish(){
  clearInterval(S.tm);const t=S.qs.length,p=Math.round(S.score/t*100),w=S.wrong;
  $('app').innerHTML=`<div class="card"><div class="big">${p}</div><div style="text-align:center" class="mut">Benar ${S.score} dari ${t} • ${esc(S.mapel)}${S.exam?' • mode ujian':''}</div>
    ${w.length?`<button class="btn full" onclick="retry()">🔁 Ulangi ${w.length} soal yang salah</button>`:''}<button class="btn alt full" onclick="S.tab='latihan';home()">Kembali</button></div>
    ${w.length?`<div class="card"><h3>Review soal salah</h3>${w.map((x,i)=>`<div class="gi" style="display:block"><b>${i+1}. ${esc(x.q)}</b><div class="small" style="margin-top:6px;color:var(--bad)">Jawabanmu: ${esc(x.o[x.pick])}</div><div class="small" style="color:var(--b)">Benar: ${esc(x.o[x.a])}</div>${x.e?`<div class="exp">💡 ${esc(x.e)}</div>`:''}</div>`).join('')}</div>`:''}`;
  if(!S.retry)try{await db.collection('hasil').add({uid:user.uid,kategori:S.sec,mapel:S.mapel,skor:S.score,total:t,mode:S.exam?'ujian':'latihan',waktu:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.error(e)}
}
async function loadHist(){
  try{const s=await db.collection('hasil').where('uid','==',user.uid).limit(300).get();
    const r=s.docs.map(d=>d.data()).filter(x=>x.kategori===S.sec).sort((a,b)=>(b.waktu?.seconds||0)-(a.waktu?.seconds||0));
    const g={};r.forEach(x=>(g[x.mapel]=g[x.mapel]||[]).push(x.skor/x.total*100));
    const av=a=>Math.round(a.reduce((p,c)=>p+c,0)/a.length);S.avg=g[S.mapel]?av(g[S.mapel]):null;
    if(!$('stat'))return;
    ($('stat')||{}).innerHTML=Object.keys(g).length?Object.entries(g).map(([m,a])=>`<div style="margin-bottom:10px"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(m)} (${a.length}x)</span><b>${av(a)}%</b></div><div class="bar" style="margin:4px 0 0"><i style="width:${av(a)}%"></i></div></div>`).join(''):'Belum ada data.';
    ($('hist')||{}).innerHTML=r.length?r.slice(0,8).map(x=>`<div class="item"><span>${esc(x.mapel)}${x.mode==='ujian'?' 📝':''}</span><b>${x.skor}/${x.total}</b></div>`).join(''):'Belum ada riwayat.';
  }catch(e){if($('hist'))($('hist')||{}).textContent='Gagal memuat riwayat.'}
}

/* ---- Bank soal: edit, subtopik, anti-duplikat ---- */
function editForm(x){return `<div class="gi" style="display:block"><label>Soal</label><textarea id="eq" style="min-height:70px">${esc(x.q)}</textarea>${x.o.map((o,k)=>`<label>Opsi ${String.fromCharCode(65+k)}</label><input id="eo${k}" value="${esc(o)}">`).join('')}
  <div class="row"><div><label>Jawaban benar</label><select id="ea">${x.o.map((_,k)=>`<option value="${k}" ${k===x.a?'selected':''}>${String.fromCharCode(65+k)}</option>`).join('')}</select></div><div><label>Subtopik</label><input id="es" value="${esc(x.sub||'')}"></div></div>
  <label>Pembahasan</label><textarea id="ee" style="min-height:60px">${esc(x.e||'')}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn" onclick="saveEdit('${x.id}')">Simpan</button><button class="btn alt" onclick="S.edit=null;drawBank()">Batal</button></div></div>`}
function drawBank(){
  ($('bl')||{}).innerHTML=S.bank.length?`<div class="small" style="margin-bottom:8px">${S.bank.length} soal</div>`+S.bank.map(x=>x.id===S.edit?editForm(x):`<div class="gi"><div><b>${esc(x.q)}</b><div class="mut small">✅ ${esc(x.o[x.a])}${x.sub?' • 🏷 '+esc(x.sub):''}${x.sumber==='ai'?' • 🤖':''}</div></div><button class="x" style="background:#262b55;color:#eef0ff" onclick="S.edit='${x.id}';drawBank()">✏️</button><button class="x" onclick="del('${x.id}')">🗑</button></div>`).join('')+`<button class="btn red full" onclick="delAll()">Hapus semua soal ${esc(S.mapel)}</button>`:'Belum ada soal. Buat dengan ✨ Soal atau tambah manual.';
}
async function saveEdit(id){
  const x=S.bank.find(b=>b.id===id),o=x.o.map((_,k)=>$('eo'+k).value.trim());
  if(!$('eq').value.trim()||o.some(v=>!v))return alert('Soal dan semua opsi harus diisi');
  const d={q:$('eq').value.trim(),o,a:+$('ea').value,sub:$('es').value.trim(),e:$('ee').value.trim()};
  await db.collection('soal').doc(id).update(d);Object.assign(x,d);S.edit=null;drawBank();
}
async function dedupe(list){
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).get();
  const have=new Set(s.docs.map(d=>nk(d.data().q)));return list.filter(x=>{const k=nk(x.q);if(have.has(k))return false;have.add(k);return true});
}
async function saveGen(){
  const sel=S.gen.filter((x,i)=>$('g'+i)&&$('g'+i).checked);if(!sel.length)return alert('Tidak ada soal dicentang');
  const sub=$('gt')?$('gt').value.trim():'',nw=await dedupe(sel),b=db.batch();
  nw.forEach(x=>b.set(db.collection('soal').doc(),{...x,uid:user.uid,kategori:S.sec,mapel:S.mapel,sub,sumber:'ai'}));await b.commit();
  alert(`${nw.length} soal tersimpan`+(sel.length>nw.length?` (${sel.length-nw.length} duplikat dilewati)`:''));S.gen=[];S.tab='bank';home();
}
async function importQ(){
  let arr;try{arr=JSON.parse($('imp').value)}catch(e){return alert('JSON tidak valid')}
  if(!Array.isArray(arr))return alert('Harus berupa array');
  const ok=await dedupe(arr.filter(x=>x.q&&Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length));
  for(let i=0;i<ok.length;i+=20){const b=db.batch();ok.slice(i,i+20).forEach(x=>b.set(db.collection('soal').doc(),{q:x.q,o:x.o,a:x.a,e:x.e||'',sub:x.sub||'',uid:user.uid,kategori:S.sec,mapel:S.mapel}));await b.commit()}
  alert(`${ok.length} soal tersimpan (${arr.length-ok.length} dilewati: tidak valid/duplikat)`);pBank();
}

/* ---- Jurnal trading + kalkulator lot ---- */
function pJurnal(){
  $('pane').innerHTML=`<div class="card"><h3>🧮 Kalkulator lot</h3><div class="row"><div><label>Saldo ($)</label><input id="kb" type="number" value="1000"></div><div><label>Risiko (%)</label><input id="kr" type="number" value="1" step="0.1"></div></div>
    <div class="row"><div><label>Stop loss (pips)</label><input id="ks" type="number" value="20"></div><div><label>Nilai pip per 1 lot ($)</label><input id="kp" type="number" value="10"></div></div>
    <button class="btn full" onclick="calc()">Hitung</button><div id="kout" class="exp"></div></div>
  <div class="card"><h3>📒 Catat trade</h3><div class="row"><input id="jp" placeholder="Pair (EURUSD)"><select id="jd"><option>Buy</option><option>Sell</option></select></div>
    <div class="row" style="margin-top:10px"><input id="je" type="number" step="any" placeholder="Entry"><input id="jl" type="number" step="any" placeholder="SL"><input id="jt" type="number" step="any" placeholder="TP"></div>
    <div class="row" style="margin-top:10px"><input id="jr" type="number" step="any" placeholder="Hasil (R, contoh 2 / -1)"><input id="js" placeholder="Setup (OB, FVG...)"></div>
    <textarea id="jn" style="margin-top:10px;min-height:70px" placeholder="Catatan / evaluasi"></textarea><button class="btn full" onclick="saveJ()">Simpan trade</button></div>
  <div class="card"><h3>📈 Jurnal</h3><div id="jlist" class="mut">Memuat...</div></div>
  <div class="card"><h3>📝 Catatan</h3><textarea id="cat" placeholder="Catatan bebas..."></textarea><button class="btn alt full" onclick="saveNote()">Simpan catatan</button><div id="notes"></div></div>`;
  calc();loadJ();loadNotes();
}
function calc(){
  const b=+$('kb').value,r=+$('kr').value,s=+$('ks').value,p=+$('kp').value;
  if(!(b>0&&r>0&&s>0&&p>0)){$('kout').textContent='Isi semua angka dengan benar.';return}
  const risk=b*r/100;$('kout').innerHTML=`Risiko: <b>$${risk.toFixed(2)}</b><br>Ukuran lot: <b>${(risk/(s*p)).toFixed(2)}</b> lot<br><span class="small">Nilai pip $10/lot berlaku untuk pair berakhiran USD. Pair lain berbeda, cek broker-mu.</span>`;
}
async function saveJ(){
  if(!$('jp').value.trim())return alert('Isi pair');
  const n=id=>$(id).value===''?null:+$(id).value;
  await db.collection('jurnal').add({uid:user.uid,pair:$('jp').value.trim().toUpperCase(),arah:$('jd').value,entry:n('je'),sl:n('jl'),tp:n('jt'),r:n('jr'),setup:$('js').value.trim(),catatan:$('jn').value.trim(),waktu:firebase.firestore.FieldValue.serverTimestamp()});
  ['jp','je','jl','jt','jr','js','jn'].forEach(i=>$(i).value='');loadJ();
}
async function loadJ(){
  try{const s=await db.collection('jurnal').where('uid','==',user.uid).limit(200).get();
    const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.waktu?.seconds||0)-(x.waktu?.seconds||0));
    const rs=a.filter(x=>x.r!=null),tot=rs.reduce((p,x)=>p+x.r,0),win=rs.filter(x=>x.r>0).length;
    if(!$('jlist'))return;
    ($('jlist')||{}).innerHTML=a.length?`<div class="small" style="margin-bottom:8px;color:var(--tx)">${a.length} trade • Win rate ${rs.length?Math.round(win/rs.length*100):0}% • Total <b>${tot.toFixed(2)}R</b> • Rata-rata ${rs.length?(tot/rs.length).toFixed(2):0}R</div>`+a.slice(0,15).map(x=>`<div class="gi"><div><b>${esc(x.pair)} ${esc(x.arah)}</b> ${x.setup?'• '+esc(x.setup):''}<div class="mut small">${x.r!=null?(x.r>0?'✅ +':'❌ ')+x.r+'R':'—'}${x.catatan?' • '+esc(x.catatan):''}</div></div><button class="x" onclick="delJ('${x.id}')">🗑</button></div>`).join(''):'Belum ada trade.';
  }catch(e){if($('jlist'))($('jlist')||{}).textContent='Gagal memuat jurnal.'}
}
async function delJ(id){if(!confirm('Hapus trade ini?'))return;await db.collection('jurnal').doc(id).delete();loadJ()}
/* ===== END V3 ===== */
</script>
<script>
/* ===== UPDATE V4 ===== */
async function ai(system,messages,big,search,q){
  const tk=await user.getIdToken();
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),85000);let r;
  try{r=await fetch('/api/chat',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({system,messages,big:!!big,search:!!search,q:q||''})})}
  catch(e){throw new Error(e.name==='AbortError'?'Server terlalu lama menjawab (timeout). Coba lagi, atau matikan Google Search.':e.message)}finally{clearTimeout(to)}
  let j;try{j=await r.json()}catch(e){throw new Error('Server error '+r.status+'. Cek Logs di Vercel (kemungkinan timeout atau fungsi error).')}
  if(!r.ok)throw new Error(j.error||'AI gagal');
  let t=j.text;
  if(search&&!big){
    if(j.sources&&j.sources.length)t+='\n\n🔎 Sumber Google:\n'+j.sources.slice(0,5).map(s=>`[[${String(s.title).replace(/[|\]]/g,' ')}|${s.uri}]]`).join('\n');
    else if(j.grounded===false)t+='\n\n⚠️ Google Search tidak tersedia untuk jawaban ini.';
    if(j.videos&&j.videos.length)t+='\n\n🎬 Video belajar (rekomendasi, bukan sumber fakta):\n'+j.videos.slice(0,4).map(v=>`[[${String(v.title).replace(/[|\]]/g,' ')}|${v.uri}]]`).join('\n');
  }
  return t;
}
function tutorSys(){
  return (S.sec==='trading'
   ?`Kamu tutor ${S.mapel} untuk edukasi trading forex. Jawab dalam Bahasa Indonesia, jelas, bertahap, dengan contoh. Ini edukasi, bukan saran finansial; ingatkan risiko bila relevan.`
   :`Kamu tutor ${isUmum()?'pengetahuan umum':S.mapel} untuk siswa Indonesia (level sekolah sampai TKA). Jawab dalam Bahasa Indonesia, jelas, bertahap, ringkas, dengan contoh. Jika siswa salah, koreksi dengan sopan. Jangan mengarang fakta.`)
   +` Tulis rumus matematika dengan LaTeX di antara \\( dan \\).`+(S.avg!=null?` Rata-rata nilai latihan siswa di pelajaran ini ${S.avg}%; sesuaikan tingkat penjelasan.`:'')
   +' Jadikan hasil Google Search sebagai patokan fakta; jika tidak ditemukan sumber yang jelas, katakan terus terang.';
}
async function send(){
  const v=$('ci').value.trim();if(!v)return;$('ci').value='';
  const c=S.chat[S.mapel]=S.chat[S.mapel]||[];c.push({role:'user',content:v},{role:'assistant',content:'⏳ Mencari & berpikir...'});drawChat();
  let h=c.slice(0,-1).filter(m=>!m.content.startsWith('⚠️')).slice(-12);while(h.length&&h[0].role!=='user')h.shift();
  try{c[c.length-1].content=await ai(tutorSys(),h,false,true,S.mapel+': '+v)}catch(e){c[c.length-1].content='⚠️ '+e.message}
  if($('chat'))drawChat();
}
async function explain(k){
  const q=S.qs[S.i];($('aiexp')||{}).innerHTML='<div class="exp">⏳ Tutor AI menjelaskan...</div>';
  try{const t=await ai(tutorSys(),[{role:'user',content:`Jelaskan langkah demi langkah kenapa jawaban soal ini benar, dan kenapa pilihan saya (${String.fromCharCode(65+k)}) ${k===q.a?'sudah benar':'salah'}.\nSoal: ${q.q}\nPilihan: ${q.o.map((o,i)=>String.fromCharCode(65+i)+'. '+o).join(' | ')}\nJawaban benar: ${String.fromCharCode(65+q.a)}`}],false,false);
    ($('aiexp')||{}).innerHTML=`<div class="exp">${fmt(t)}</div>`;
  }catch(e){($('aiexp')||{}).innerHTML=`<div class="exp">⚠️ ${esc(e.message)}</div>`}
}

/* ---- jenis soal: pilihan ganda / benar-salah ---- */
function normQ(x){
  if(!x||!x.q||!Array.isArray(x.o)||x.o.length<2||!Number.isInteger(x.a)||x.a<0||x.a>=x.o.length)return null;
  const bs=x.tipe==='bs'||(x.o.length===2&&/^benar$/i.test(String(x.o[0]).trim())&&/^salah$/i.test(String(x.o[1]).trim()));
  if(bs)return{q:String(x.q),o:['Benar','Salah'],a:/^benar$/i.test(String(x.o[x.a]).trim())?0:1,e:x.e?String(x.e):'',tipe:'bs'};
  const o0=x.o.map(cleanOpt),c=o0[x.a],o=shuffle(o0);return{q:String(x.q),o,a:o.indexOf(c),e:x.e?String(x.e):''};
}
function pBuat(){
  if(isUmum()){$('pane').innerHTML='<div class="card mut">Trivia Dunia mengambil soal otomatis dari internet. Pilih pelajaran lain untuk membuat soal dengan AI.</div>';return}
  $('pane').innerHTML=`<div class="card"><h3>✨ Buat soal ${esc(S.mapel)} dengan AI</h3>
    <label>Topik / materi spesifik</label><input id="gt" placeholder="${S.sec==='trading'?'contoh: Order Block, Fair Value Gap':'contoh: pecahan, kalimat efektif, hukum Newton'}">
    <div class="row"><div><label>Jumlah</label><select id="gn"><option>5</option><option selected>10</option><option>20</option><option>25</option></select></div>
    <div><label>Jenis soal</label><select id="gj"><option>Pilihan ganda</option><option>Benar/Salah</option><option>Campuran</option></select></div></div>
    <div class="row"><div><label>Tingkat</label><select id="gl">${LEVEL[S.sec].map(l=>`<option>${l}</option>`).join('')}</select></div>
    <div><label>Kesulitan</label><select id="gd"><option>Mudah</option><option selected>Sedang</option><option>Sulit</option><option>Campuran</option></select></div></div>
    <label>Instruksi khusus (opsional)</label><textarea id="gx" placeholder="contoh: soal cerita sehari-hari, pengecoh masuk akal, pembahasan langkah demi langkah"></textarea>
    <div class="mut small" style="margin-top:10px">🔎 Semua soal diverifikasi dengan Google Search.</div>
    <button class="btn full" id="gb" onclick="gen()">Buat soal ✨</button><div id="gm" class="mut small" style="margin-top:10px"></div></div><div id="gres"></div>`;
  drawGen();
}
async function gen(){
  const topik=$('gt').value.trim();if(!topik){($('gm')||{}).textContent='Isi topik dulu.';return}
  const n=+$('gn').value,lv=$('gl').value,df=$('gd').value,jn=$('gj').value,ex=$('gx').value.trim(),se=true,parts=[];
  for(let l=n;l>0;l-=10)parts.push(Math.min(10,l));
  const jt={'Pilihan ganda':'SEMUA soal pilihan ganda dengan 4 opsi (tanpa field tipe).','Benar/Salah':'SEMUA soal Benar/Salah: "q" berupa pernyataan, "o":["Benar","Salah"], "a" 0 jika pernyataan benar atau 1 jika salah, dan tambah "tipe":"bs".','Campuran':'Campuran pilihan ganda (4 opsi) dan Benar/Salah, kira-kira setengah-setengah; soal Benar/Salah memakai "o":["Benar","Salah"], "a" 0/1, "tipe":"bs".'}[jn];
  const sys=`Kamu pembuat soal ${S.mapel} untuk ${S.sec==='trading'?'edukasi trading forex':'siswa Indonesia'}. Keluarkan HANYA JSON array valid tanpa teks lain dan tanpa markdown. Tiap item: {"q":"pertanyaan","o":["opsi1","opsi2","opsi3","opsi4"],"a":indeks_jawaban_benar,"e":"pembahasan singkat langkah demi langkah"}. ${jt} Aturan: soal jelas dan tidak ambigu, tepat satu jawaban benar, fakta akurat, Bahasa Indonesia, opsi tanpa awalan huruf, pengecoh masuk akal, tidak ada duplikat. Rumus matematika ditulis LaTeX di antara \\( dan \\); semua backslash di dalam JSON wajib digandakan.${se?' Verifikasi fakta dengan Google Search dan jadikan hasilnya patokan kebenaran jawaban.':''}`;
  ($('gb')||{}).disabled=true;($('gm')||{}).textContent=`⏳ AI sedang membuat ${n} soal...`;
  try{
    const out=await Promise.all(parts.map((c,i)=>ai(sys,[{role:'user',content:`Buat ${c} soal.\nMapel: ${S.mapel}\nTopik: ${topik}\nJenis: ${jn}\nTingkat: ${lv}\nKesulitan: ${df}\n${parts.length>1?`Ini bagian ${i+1} dari ${parts.length}; variasikan sub-topik.\n`:''}${ex?'Instruksi khusus: '+ex:''}`}],true,se,S.mapel+' '+topik)));
    let all=[];out.forEach(t=>{const m=t.match(/\[[\s\S]*\]/);if(m)try{all=all.concat(JSON.parse(m[0].replace(/\\(["\\/bfnrtu])|\\/g,(a,g)=>g?a:'\\\\')).map(normQ).filter(Boolean))}catch(e){}});
    let vf=false;
    if(all.length){($('gm')||{}).textContent='🔎 Memverifikasi silang jawaban dengan sumber...';
      try{const ch=[];for(let i=0;i<all.length;i+=10)ch.push(all.slice(i,i+10));
        const vs=`Kamu pemeriksa soal ${S.mapel}. Periksa setiap soal terhadap sumber pencarian dan pengetahuan yang valid. Perbaiki kunci jawaban dan pembahasan yang salah, buang soal yang ambigu atau tidak bisa dipastikan. Keluarkan HANYA JSON array valid dengan format item yang sama ({"q","o","a","e"}, tambah "tipe":"bs" untuk Benar/Salah), tanpa teks lain. Backslash di JSON wajib digandakan.`;
        const vr=await Promise.all(ch.map(cc=>ai(vs,[{role:'user',content:JSON.stringify(cc)}],true,true,S.mapel+' '+topik)));
        let ok=[];vr.forEach(t=>{const m=t.match(/\[[\s\S]*\]/);if(m)try{ok=ok.concat(JSON.parse(m[0].replace(/\\(["\\/bfnrtu])|\\/g,(a,g)=>g?a:'\\\\')).map(normQ).filter(Boolean))}catch(e){}});
        if(ok.length){all=ok;vf=true}
      }catch(e){}}
    S.gen=all;($('gm')||{}).textContent=all.length?`✅ ${all.length} soal siap${vf?' (sudah diverifikasi silang dengan sumber)':' (verifikasi silang gagal, periksa manual)'}. Hapus yang salah (✕), lalu simpan.`:'AI tidak mengembalikan soal yang valid. Coba lagi.';
  }catch(e){($('gm')||{}).textContent='⚠️ '+e.message}
  ($('gb')||{}).disabled=false;drawGen();
}
function pLatihan(){
  $('pane').innerHTML=`<div class="card"><h3>Mulai latihan: ${esc(S.mapel)}</h3>
    ${isUmum()?'':`<label>Subtopik (opsional)</label><input id="sub" placeholder="kosong = semua, contoh: pecahan" value="${esc(S.sub||'')}">
    <label>Jenis soal</label><select id="lt"><option value="">Semua</option><option value="pg">Pilihan ganda</option><option value="bs">Benar/Salah</option></select>`}
    <label>Jumlah soal</label><select id="n"><option>5</option><option selected>10</option><option>25</option><option>50</option></select>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="ex" style="width:18px"> Mode ujian (timer, pembahasan setelah selesai)</label>
    <button class="btn full" onclick="start()">Mulai ▶</button><div id="msg" class="mut small" style="margin-top:10px"></div></div>
    <div class="card"><h3>📊 Statistik <span class="mut small">(ketuk untuk detail)</span></h3><div id="stat" class="mut">Memuat...</div></div>
    <div class="card"><h3>🏆 Riwayat <span class="mut small">(ketuk untuk lihat soal)</span></h3><div id="hist" class="mut">Memuat...</div></div>`;
  loadHist();
}
async function loadQs2(n){
  if(isUmum())return loadQs(n);
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
  let a=s.docs.map(d=>d.data()),sub=(S.sub||'').toLowerCase();
  if(sub)a=a.filter(x=>(x.sub||'').toLowerCase().includes(sub));
  if(S.jenis==='bs')a=a.filter(x=>x.tipe==='bs');if(S.jenis==='pg')a=a.filter(x=>x.tipe!=='bs');
  return shuffle(a).slice(0,n);
}
async function start(){
  S.sub=$('sub')?$('sub').value.trim():'';S.jenis=$('lt')?$('lt').value:'';S.exam=$('ex').checked;S.retry=false;($('msg')||{}).textContent='Memuat soal...';
  try{const qs=await loadQs2(+$('n').value);
    if(!qs.length){($('msg')||{}).textContent='Tidak ada soal (cek subtopik/jenis soal atau buat soal dulu).';return}
    Object.assign(S,{qs,i:0,score:0,wrong:[],ans:[]});clearInterval(S.tm);
    if(S.exam){S.left=Math.ceil(qs.length*90);S.tm=setInterval(()=>{S.left--;const e=$('tmr');if(e)e.textContent=fmtT(S.left);if(S.left<=0)finish()},1000)}
    show();
  }catch(e){($('msg')||{}).textContent='Gagal: '+e.message}
}
function retry(){Object.assign(S,{qs:shuffle(S.wrong.map(({pick,...q})=>q)),i:0,score:0,wrong:[],ans:[],exam:false,retry:true});clearInterval(S.tm);show()}
function pick(k){
  if(S.done)return;S.done=true;const q=S.qs[S.i];
  S.ans.push({q:q.q,o:q.o,a:q.a,pick:k,e:q.e||'',tipe:q.tipe||'pg'});
  if(k===q.a)S.score++;else S.wrong.push({...q,pick:k});
  if(S.exam){S.i++;return show()}
  const bs=document.querySelectorAll('.opt');bs.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok')});if(k!==q.a)bs[k].classList.add('no');
  $('fb').innerHTML=`${q.e?`<div class="exp">💡 ${esc(q.e)}</div>`:''}<div id="aiexp"></div>
    <div class="row" style="margin-top:12px"><button class="btn alt" onclick="explain(${k})">🤖 Jelaskan lebih detail</button><button class="btn" onclick="S.i++;show()">${S.i+1<S.qs.length?'Lanjut ▶':'Hasil'}</button></div>`;
}
async function finish(){
  clearInterval(S.tm);const t=S.qs.length,p=Math.round(S.score/t*100),w=S.wrong;
  $('app').innerHTML=`<div class="card"><div class="big">${p}</div><div style="text-align:center" class="mut">Benar ${S.score} dari ${t} • ${esc(S.mapel)}${S.exam?' • mode ujian':''}</div>
    ${w.length?`<button class="btn full" onclick="retry()">🔁 Ulangi ${w.length} soal yang salah</button>`:''}<button class="btn alt full" onclick="S.tab='latihan';home()">Kembali</button></div>
    ${w.length?`<div class="card"><h3>Review soal salah</h3>${w.map((x,i)=>`<div class="gi" style="display:block"><b>${i+1}. ${esc(x.q)}</b><div class="small" style="margin-top:6px;color:var(--bad)">Jawabanmu: ${esc(x.o[x.pick])}</div><div class="small" style="color:var(--b)">Benar: ${esc(x.o[x.a])}</div>${x.e?`<div class="exp">💡 ${esc(x.e)}</div>`:''}</div>`).join('')}</div>`:''}`;
  if(!S.retry)try{await db.collection('hasil').add({uid:user.uid,kategori:S.sec,mapel:S.mapel,skor:S.score,total:t,mode:S.exam?'ujian':'latihan',detail:S.ans,waktu:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.error(e)}
}

/* ---- statistik & riwayat bisa diklik ---- */
const dt=x=>x.waktu&&x.waktu.seconds?new Date(x.waktu.seconds*1000).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const avg=a=>Math.round(a.reduce((p,c)=>p+c,0)/a.length);
async function loadHist(){
  try{const s=await db.collection('hasil').where('uid','==',user.uid).limit(100).get();
    const r=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.kategori===S.sec).sort((a,b)=>(b.waktu?.seconds||0)-(a.waktu?.seconds||0));
    S.att=r;const g={};r.forEach(x=>(g[x.mapel]=g[x.mapel]||[]).push(x.skor/x.total*100));S.gk=Object.keys(g);S.avg=g[S.mapel]?avg(g[S.mapel]):null;
    if(!$('stat'))return;
    ($('stat')||{}).innerHTML=S.gk.length?S.gk.map((m,i)=>`<div style="margin-bottom:12px;cursor:pointer" onclick="showMapel(${i})"><div class="small" style="display:flex;justify-content:space-between"><span>${esc(m)} (${g[m].length}x) ›</span><b>${avg(g[m])}%</b></div><div class="bar" style="margin:4px 0 0"><i style="width:${avg(g[m])}%"></i></div></div>`).join(''):'Belum ada data.';
    ($('hist')||{}).innerHTML=r.length?r.slice(0,10).map(x=>`<div class="item" style="cursor:pointer" onclick="showAttempt('${x.id}')"><span>${esc(x.mapel)}${x.mode==='ujian'?' 📝':''} <span class="mut small">${dt(x)}</span></span><b>${x.skor}/${x.total} ›</b></div>`).join(''):'Belum ada riwayat.';
  }catch(e){if($('hist'))($('hist')||{}).textContent='Gagal memuat riwayat.'}
}
function showAttempt(id,f){
  const h=S.att.find(x=>x.id===id);if(!h)return;f=f||'semua';const d=h.detail||[],ok=x=>x.pick===x.a;
  const list=d.filter(x=>f==='semua'||(f==='salah'?!ok(x):ok(x)));
  $('app').innerHTML=`<div class="card"><button class="btn alt" onclick="home()">← Kembali</button><h3 style="margin-top:14px">${esc(h.mapel)} • ${h.skor}/${h.total}</h3><div class="mut small">${dt(h)}${h.mode==='ujian'?' • mode ujian':''}</div>
    ${d.length?`<div class="row" style="margin-top:12px">${['semua','salah','benar'].map(k=>`<button class="btn ${f===k?'':'alt'}" style="padding:9px 4px" onclick="showAttempt('${id}','${k}')">${k==='semua'?'Semua ('+d.length+')':k==='salah'?'❌ Salah ('+d.filter(x=>!ok(x)).length+')':'✅ Benar ('+d.filter(ok).length+')'}</button>`).join('')}</div>
    ${d.some(x=>!ok(x))?`<button class="btn full" onclick="redoWrong('${id}')">🔁 Latih ulang soal yang salah</button>`:''}`:'<div class="mut" style="margin-top:12px">Detail soal tidak tersedia untuk latihan lama ini.</div>'}</div>
    ${list.map((x,i)=>`<div class="card"><b>${i+1}. ${ok(x)?'✅':'❌'} ${esc(x.q)}</b>${x.o.map((o,k)=>`<div class="small" style="padding:4px 0;color:${k===x.a?'var(--b)':k===x.pick?'var(--bad)':'var(--mut)'}">${k===x.a?'✔ ':k===x.pick?'✘ ':'• '}${esc(o)}</div>`).join('')}${x.e?`<div class="exp">💡 ${esc(x.e)}</div>`:''}</div>`).join('')}`;
}
function redoWrong(id){const h=S.att.find(x=>x.id===id);S.sec=h.kategori;S.mapel=h.mapel;S.wrong=(h.detail||[]).filter(x=>x.pick!==x.a);retry()}
function showMapel(i){
  const m=S.gk[i],at=S.att.filter(x=>x.mapel===m),mp=new Map();
  at.forEach(a=>(a.detail||[]).forEach(x=>{if(x.pick!==x.a){const k=nk(x.q),v=mp.get(k);if(v)v.n++;else mp.set(k,{...x,n:1})}}));
  const wl=[...mp.values()].sort((a,b)=>b.n-a.n);S.wl=wl;
  $('app').innerHTML=`<div class="card"><button class="btn alt" onclick="home()">← Kembali</button><h3 style="margin-top:14px">${esc(m)}</h3><div class="mut small">${at.length} latihan • rata-rata ${avg(at.map(x=>x.skor/x.total*100))}%</div></div>
    <div class="card"><h3>Riwayat</h3>${at.map(x=>`<div class="item" style="cursor:pointer" onclick="showAttempt('${x.id}')"><span class="mut small">${dt(x)}</span><b>${x.skor}/${x.total} ›</b></div>`).join('')}</div>
    <div class="card"><h3>❌ Soal yang pernah salah (${wl.length})</h3>${wl.slice(0,30).map(x=>`<div class="gi" style="display:block"><b>${esc(x.q)}</b><div class="small" style="color:var(--b);margin-top:4px">Benar: ${esc(x.o[x.a])} <span class="mut">• salah ${x.n}x</span></div>${x.e?`<div class="exp">💡 ${esc(x.e)}</div>`:''}</div>`).join('')||'<div class="mut">Belum ada soal yang salah 🎉</div>'}
    ${wl.length?`<button class="btn full" onclick="S.sec=S.att[0].kategori;S.mapel=${JSON.stringify(m).replace(/"/g,'&quot;')};S.wrong=S.wl;retry()">🔁 Latih soal-soal ini</button>`:''}</div>`;
}
/* ===== END V4 ===== */
</script>
<script>
/* ===== UPDATE V5 ===== */
document.head.insertAdjacentHTML('beforeend','<style>.opt.sel{border-color:var(--a);background:#1d2250}.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.nb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#12152e;color:var(--tx);cursor:pointer;font-size:.8rem}.nb.done{background:#12352f;border-color:var(--b)}.nb.flag{border-color:#ffd48a;background:#3a2a10}.nb.cur{outline:2px solid var(--a)}a{word-break:break-all}.btn:disabled{opacity:.4}</style>');
let SRC=[],LT=0,RV={};
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const optL=(i)=>String.fromCharCode(65+i);
const srcLinks=x=>x.src&&x.src.length?`<div class="small" style="margin-top:8px">📚 Sumber: ${x.src.map(s=>`<a href="${esc(s.uri)}" target="_blank" rel="noopener" style="color:var(--b)">${esc(hostOf(s.uri))}</a>`).join(' • ')}</div>`:'';

async function ai(system,messages,big,search,q,cat){
  const tk=await user.getIdToken();
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),85000);let r;
  try{r=await fetch('/api/chat',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify({system,messages,big:!!big,search:!!search,q:q||'',cat:cat||catFor()})})}
  catch(e){throw new Error(e.name==='AbortError'?'Server terlalu lama menjawab (timeout). Coba lagi.':e.message)}finally{clearTimeout(to)}
  let j;try{j=await r.json()}catch(e){throw new Error('Server error '+r.status+'. Cek Logs di Vercel.')}
  if(!r.ok)throw new Error(j.error||'AI gagal');
  let t=j.text;
  if(search){(j.sources||[]).forEach(s=>{if(!SRC.some(x=>x.uri===s.uri))SRC.push(s)});LT=Math.max(LT,j.trusted||0)}
  if(search&&!big){
    if(j.sources&&j.sources.length)t+='\n\n🔎 Sumber:\n'+j.sources.slice(0,5).map(s=>`[[${String(s.title).replace(/[|\]]/g,' ')}|${s.uri}]]`).join('\n');
    else if(j.grounded===false)t+='\n\n⚠️ Tidak ada sumber terpercaya yang ditemukan; jawaban ini dari pengetahuan AI, cek ulang sebelum dipakai.';
  }
  return t;
}

const whyPrompt=(q,k)=>`${k===q.a?'Siswa menjawab BENAR. Jelaskan singkat konsep di balik jawaban ini dan jebakan pengecohnya.':k<0?'Siswa TIDAK menjawab soal ini. Jelaskan cara berpikir untuk menjawabnya dan kenapa kunci benar.':'Siswa menjawab SALAH. Jelaskan: (1) kenapa pilihan siswa ('+optL(k)+') salah, (2) kenapa kunci ('+optL(q.a)+') benar, (3) tips agar tidak keliru lagi.'} Jangan mengubah kunci jawaban.\nSoal: ${q.q}\nPilihan: ${q.o.map((o,i)=>optL(i)+'. '+o).join(' | ')}\nKunci: ${optL(q.a)}\nPembahasan awal: ${q.e||'-'}`;

  catch(e){if(b())b().innerHTML=`<div class="exp">⚠️ ${esc(e.message)} <button class="x" onclick="explainAuto(true)">Coba lagi</button></div>`}

async function loadQs2(n){
  if(isUmum())return loadQs(n);
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();
  let a=s.docs.map(d=>d.data()),sub=(S.sub||'').toLowerCase();

  if(S.jenis==='bs')a=a.filter(x=>x.tipe==='bs');if(S.jenis==='pg')a=a.filter(x=>x.tipe!=='bs');
  return shuffle(a).slice(0,n).map(q=>{if(q.tipe==='bs')return q;const c=q.o[q.a],o=shuffle(q.o);return{...q,o,a:o.indexOf(c)}});

    ${S.exam?`<div class="nav">${S.qs.map((_,k)=>`<button class="nb ${k===i?'cur':''} ${S.sel[k]!=null?'done':''} ${S.flag[k]?'flag':''}" onclick="S.i=${k};show()">${k+1}</button>`).join('')}</div><button class="btn alt full" onclick="confirmFinish()">Kumpulkan sekarang</button>`:''}</div>`;

  clearInterval(S.tm);clearProg();RV={};

  S.ans=ans;S.score=ans.filter(x=>x.pick===x.a).length;const t=ans.length,p=Math.round(S.score/t*100),w=ans.filter(x=>x.pick!==x.a);S.wrong=w;S.curId=null;

    ${w.length?`<button class="btn full" onclick="retry()">🔁 Ulangi ${w.length} soal yang salah</button><button class="btn alt full" onclick="explainAll()">🤖 Jelaskan semua yang salah</button>`:'<div style="text-align:center;margin-top:10px">🎉 Semua benar!</div>'}<button class="btn alt full" onclick="S.tab='latihan';home()">Kembali</button></div>

  if(!S.retry)try{const r=await db.collection('hasil').add({uid:user.uid,kategori:S.sec,mapel:S.mapel,skor:S.score,total:t,mode:S.exam?'ujian':'latihan',detail:ans,waktu:firebase.firestore.FieldValue.serverTimestamp()});S.curId=r.id}catch(e){console.error(e)}
}

const parseQsOld=t=>{const m=t.match(/\[[\s\S]*\]/);if(!m)return[];try{return JSON.parse(m[0].replace(/\\(["\\/bfnrtu])|\\/g,(a,g)=>g?a:'\\\\')).map(normQ).filter(Boolean)}catch(e){return[]}};
async function gen(){
  const topik=$('gt').value.trim();if(!topik){($('gm')||{}).textContent='Isi topik dulu.';return}
  const n=+$('gn').value,lv=$('gl').value,df=$('gd').value,jn=$('gj').value,ex=$('gx').value.trim(),parts=[];
  for(let l=n;l>0;l-=10)parts.push(Math.min(10,l));SRC=[];LT=0;
  const jt={'Pilihan ganda':'SEMUA soal pilihan ganda dengan 4 opsi (tanpa field tipe).','Benar/Salah':'SEMUA soal Benar/Salah: "q" berupa pernyataan, "o":["Benar","Salah"], "a" 0 jika pernyataan benar atau 1 jika salah, dan tambah "tipe":"bs".','Campuran':'Campuran pilihan ganda (4 opsi) dan Benar/Salah, kira-kira setengah-setengah; soal Benar/Salah memakai "o":["Benar","Salah"], "a" 0/1, "tipe":"bs".'}[jn];
  const sys=`Kamu pembuat soal ${S.mapel} untuk ${S.sec==='trading'?'edukasi trading forex':'siswa Indonesia'}. Keluarkan HANYA JSON array valid tanpa teks lain dan tanpa markdown. Tiap item: {"q":"pertanyaan","o":["opsi1","opsi2","opsi3","opsi4"],"a":indeks_jawaban_benar,"e":"pembahasan singkat langkah demi langkah"}. ${jt} Aturan: soal jelas dan tidak ambigu, tepat satu jawaban benar, SETIAP fakta dan kunci jawaban harus didukung sumber tepercaya yang diberikan (utamakan ★resmi), jangan membuat soal dari fakta yang tidak bisa dipastikan, Bahasa Indonesia, opsi tanpa awalan huruf, pengecoh masuk akal, tidak ada duplikat. Rumus matematika ditulis LaTeX di antara \\( dan \\); semua backslash di dalam JSON wajib digandakan.`;
  ($('gb')||{}).disabled=true;($('gm')||{}).textContent=`⏳ Mengumpulkan sumber terpercaya & membuat ${n} soal...`;
  try{
    const out=await Promise.all(parts.map((c,i)=>ai(sys,[{role:'user',content:`Buat ${c} soal.\nMapel: ${S.mapel}\nTopik: ${topik}\nJenis: ${jn}\nTingkat: ${lv}\nKesulitan: ${df}\n${parts.length>1?`Ini bagian ${i+1} dari ${parts.length}; variasikan sub-topik.\n`:''}${ex?'Instruksi khusus: '+ex:''}`}],true,true,S.mapel+' '+topik)));
    let all=[];out.forEach(t=>{all=all.concat(parseQs(t))});
    let vf=false;
    if(all.length){($('gm')||{}).textContent='🔎 Memverifikasi silang jawaban dengan sumber...';
      try{const vs=`Kamu pemeriksa soal ${S.mapel}. Periksa setiap soal terhadap sumber tepercaya yang diberikan. Perbaiki kunci jawaban dan pembahasan yang salah, buang soal yang ambigu atau tidak bisa dipastikan dari sumber. Keluarkan HANYA JSON array valid dengan format item yang sama ({"q","o","a","e"}, tambah "tipe":"bs" untuk Benar/Salah), tanpa teks lain. Backslash di JSON wajib digandakan.`;
        const ch=[];for(let i=0;i<all.length;i+=10)ch.push(all.slice(i,i+10));
        const vr=await Promise.all(ch.map(cc=>ai(vs,[{role:'user',content:JSON.stringify(cc)}],true,true,S.mapel+' '+topik)));
        let ok=[];vr.forEach(t=>{ok=ok.concat(parseQs(t))});if(ok.length){all=ok;vf=true}
      }catch(e){}}
    const src=SRC.filter(s=>/^https?:/.test(s.uri)).slice(0,4).map(s=>({title:String(s.title).slice(0,80),uri:s.uri}));
    S.gen=all.map(x=>({...x,src}));
    ($('gm')||{}).textContent=all.length?`✅ ${all.length} soal siap${vf?' (terverifikasi silang)':' (verifikasi silang gagal, periksa manual)'}${LT?` • ${LT} sumber resmi dipakai`:' • ⚠️ tidak ada sumber resmi ditemukan, periksa manual'}. Hapus yang salah (✕), lalu simpan.`:'AI tidak mengembalikan soal yang valid. Coba lagi.';
  }catch(e){($('gm')||{}).textContent='⚠️ '+e.message}
  ($('gb')||{}).disabled=false;drawGen();
}
function drawGen(){
  if(!$('gres'))return;
  ($('gres')||{}).innerHTML=S.gen.length?`<div class="card"><h3>Pratinjau (${S.gen.length})</h3>${S.gen.map((x,i)=>`<div class="gi"><input type="checkbox" id="g${i}" checked><div><b>${i+1}. ${esc(x.q)}</b><div class="mut">${x.o.map((o,k)=>(k===x.a?'✅ ':'• ')+esc(o)).join('<br>')}</div><div class="mut">💡 ${esc(x.e)}</div>${i===0?srcLinks(x):''}</div><button class="x" onclick="S.gen.splice(${i},1);drawGen()">✕</button></div>`).join('')}<button class="btn full" onclick="saveGen()">💾 Simpan yang dicentang ke Bank Soal</button></div>`:'';

document.addEventListener('keydown',e=>{
  if(!document.querySelector('.opt')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k='abcd'.indexOf(e.key.toLowerCase()),n='1234'.indexOf(e.key),x=k>=0?k:n;

});

const letters=a=>Array.isArray(a)?(a.length?a.map(optL).join(', '):'-'):(a<0?'-':optL(a));
const answered=k=>{const v=S.sel[k];return v!=null&&(Array.isArray(v)?v.length>0:String(v).trim()!=='')};
function entry(q,i){const t=q.tipe||'pg',v=S.sel[i];return{q:q.q,o:q.o||[],a:q.a,pick:v!=null?v:(t==='multi'?[]:t==='essay'?'':-1),e:q.e||'',tipe:t,src:(q.src||[]).slice(0,3),aiw:q.aiw||'',teks:q.teks||'',k:q.k||'',kw:q.kw||[],sc:t==='essay'?(S.sc[i]!=null?S.sc[i]:(q.sc!=null?q.sc:0)):null}}

function normQ(x){
  if(!x||!x.q)return null;const base={q:String(x.q),e:x.e?String(x.e):''};if(x.teks)base.teks=String(x.teks);const t=x.tipe;
  if(t==='essay'){if(!x.k)return null;return{...base,tipe:'essay',o:[],a:0,k:String(x.k),kw:Array.isArray(x.kw)?x.kw.map(String).slice(0,8):[]}}
  if(!Array.isArray(x.o)||x.o.length<2)return null;
  if(t==='multi'||Array.isArray(x.a)){const a=[...new Set((Array.isArray(x.a)?x.a:[x.a]).filter(i=>Number.isInteger(i)&&i>=0&&i<x.o.length))];if(!a.length)return null;const o0=x.o.map(cleanOpt),cs=a.map(i=>o0[i]),o=shuffle(o0);return{...base,tipe:'multi',o,a:cs.map(c=>o.indexOf(c)).sort((p,q)=>p-q)}}
  if(!Number.isInteger(x.a)||x.a<0||x.a>=x.o.length)return null;
  const bs=t==='bs'||(x.o.length===2&&/^benar$/i.test(String(x.o[0]).trim())&&/^salah$/i.test(String(x.o[1]).trim())),tr=/^(benar|true)$/i;
  if(bs)return{...base,o:['Benar','Salah'],a:tr.test(String(x.o[x.a]).trim())?0:1,tipe:'bs'};
  const o0=x.o.map(cleanOpt),c=o0[x.a],o=shuffle(o0);return{...base,o,a:o.indexOf(c)};
}
const fixJ=s=>s.replace(/\\(["\\/bfnrtu])|\\/g,(a,g)=>g?a:'\\\\');
function parseQs(t){
  const mo=t.match(/\{[\s\S]*\}/),ma=t.match(/\[[\s\S]*\]/);
  try{if(mo&&(!ma||mo.index<ma.index)){const o=JSON.parse(fixJ(mo[0]));return(o.soal||[]).map(s=>normQ({...s,teks:o.teks||s.teks})).filter(Boolean)}}catch(e){}
  try{if(ma)return JSON.parse(fixJ(ma[0])).map(normQ).filter(Boolean)}catch(e){}return[];
}
function tutorSys(){
  return (S.sec==='trading'
   ?`Kamu tutor ${S.mapel} untuk edukasi trading forex. Jawab dalam Bahasa Indonesia, jelas, bertahap, dengan contoh. Ini edukasi, bukan saran finansial; ingatkan risiko bila relevan.`
   :isEng()?`You are an English tutor for Indonesian students. Answer in clear, simple English, and add a short Indonesian hint for difficult words. Be accurate; do not invent facts.`
   :`Kamu tutor ${isUmum()?'pengetahuan umum':S.mapel} untuk siswa Indonesia (level sekolah sampai TKA). Jawab dalam Bahasa Indonesia, jelas, bertahap, ringkas, dengan contoh. Jika siswa salah, koreksi dengan sopan. Jangan mengarang fakta.`)
   +` Tulis rumus matematika dengan LaTeX di antara \\( dan \\).`+(S.avg!=null?` Rata-rata nilai latihan siswa di pelajaran ini ${S.avg}%; sesuaikan tingkat penjelasan.`:'')
   +' Jadikan sumber terpercaya sebagai patokan fakta; jika tidak ada sumber yang jelas, katakan terus terang.';
}

function whyP(x){const ok=isOK(x),en=isEng();
  return `${ok?'Siswa menjawab BENAR. Jelaskan singkat konsep di balik jawaban ini dan jebakan pengecohnya.':unans(x)?'Siswa TIDAK menjawab. Jelaskan cara berpikirnya dan kenapa kunci benar.':'Siswa menjawab SALAH. Jelaskan: (1) kenapa jawaban siswa salah, (2) kenapa kunci benar, (3) tips agar tidak keliru lagi.'} ${en?'Explain in simple English (add short Indonesian hints for hard words).':''} Jangan mengubah kunci jawaban.\n${x.teks?'Teks: '+x.teks.slice(0,1500)+'\n':''}Soal: ${x.q}\nPilihan: ${x.o.map((o,i)=>optL(i)+'. '+o).join(' | ')}\nKunci: ${letters(x.a)}\nJawaban siswa: ${letters(x.pick)}\nPembahasan awal: ${x.e||'-'}`}
async function gradeEssay(q,text){
  if(!String(text||'').trim())return{sc:0,fb:'Tidak ada jawaban.'};
  const t=await ai(`Kamu penilai essay ${S.mapel}. ${isEng()?'Write the feedback in English.':'Tulis umpan balik dalam Bahasa Indonesia.'} Nilai jawaban siswa terhadap kunci dan kata kunci; jawaban yang benar dengan kata berbeda tetap diterima. Format WAJIB:\nSKOR: <angka 0-100>\nSudah tepat: ...\nKurang/keliru: ...\nSaran: ...`,[{role:'user',content:`Soal: ${q.q}\n${q.teks?'Teks: '+q.teks.slice(0,1500)+'\n':''}Kunci jawaban: ${q.k}\nKata kunci: ${(q.kw||[]).join(', ')}\nRubrik: ${q.e||'-'}\nJawaban siswa: ${text}`}],false,false);
  const m=t.match(/SKOR:\s*(\d{1,3})/i);return{sc:m?Math.min(100,+m[1]):0,fb:t.replace(/SKOR:\s*\d{1,3}/i,'').trim()};
}
const essayFb=g=>`**Skor: ${g.sc}/100**\n${g.fb}`;
async function gradeNow(i){
  const q=S.qs[i],b=()=>$('aiexp');if(b())b().innerHTML='<div class="exp">⏳ AI menilai jawabanmu...</div>';

  catch(e){if(b())b().innerHTML=`<div class="exp">⚠️ ${esc(e.message)} <button class="x" onclick="gradeNow(${i})">Coba lagi</button></div>`}
}
async function explainAuto(force){
  const i=S.i,q=S.qs[i];if(!S.dn[i]||q.tipe==='essay'||(q.aiw&&!force))return;const b=()=>$('aiexp');
  if(b())b().innerHTML='<div class="exp">⏳ Tutor AI menjelaskan...</div>';

  catch(e){if(b())b().innerHTML=`<div class="exp">⚠️ ${esc(e.message)} <button class="x" onclick="explainAuto(true)">Coba lagi</button></div>`}

function qCard(x,id,save){

}

async function loadQs2(n){

  let a=s.docs.map(d=>d.data()),sub=(S.sub||'').toLowerCase();
  if(sub)a=a.filter(x=>(x.sub||'').toLowerCase().includes(sub));
  if(S.jenis)a=a.filter(x=>(x.tipe||'pg')===S.jenis);
  return shuffle(a).slice(0,n).map(q=>{const t=q.tipe||'pg';if(t==='bs'||t==='essay')return q;const o=shuffle(q.o);return t==='multi'?{...q,o,a:q.a.map(i=>o.indexOf(q.o[i])).sort((p,r)=>p-r)}:{...q,o,a:o.indexOf(q.o[q.a])}});

function pick(k){const i=S.i;if(!S.exam&&S.dn[i])return;S.sel[i]=k;if(!S.exam)S.dn[i]=true;show()}

function show(){
  const i=S.i,q=S.qs[i],t=q.tipe||'pg',sel=S.sel[i],rev=!S.exam&&S.dn[i],last=i+1>=S.qs.length;let body='';

    ${S.exam?`<div class="nav">${S.qs.map((_,k)=>`<button class="nb ${k===i?'cur':''} ${answered(k)?'done':''} ${S.flag[k]?'flag':''}" onclick="S.i=${k};show()">${k+1}</button>`).join('')}</div><button class="btn alt full" onclick="confirmFinish()">Kumpulkan sekarang</button>`:''}</div>`;
  saveProg();

  const es=S.qs.map((q,i)=>q.tipe==='essay'&&answered(i)&&S.sc[i]==null?i:-1).filter(i=>i>=0).slice(0,12);

  const ans=S.qs.map((q,i)=>entry(q,i));S.ans=ans;S.score=ans.filter(isOK).length;
  const t=ans.length,p=Math.round(S.score/t*100),w=ans.filter(x=>!isOK(x));S.wrong=w;S.curId=null;const na=ans.filter(unans).length;
  $('app').innerHTML=`<div class="card"><div class="big">${p}</div><div style="text-align:center" class="mut">Benar ${S.score} dari ${t} • ${esc(S.mapel)}${S.exam?' • mode ujian':''}${na?` • ${na} tidak dijawab`:''}</div>
    ${w.length?`<button class="btn full" onclick="retry()">🔁 Ulangi ${w.length} soal yang salah</button><button class="btn alt full" onclick="explainAll()">🤖 Jelaskan semua yang salah</button>`:'<div style="text-align:center;margin-top:10px">🎉 Semua benar!</div>'}<button class="btn alt full" onclick="S.tab='latihan';home()">Kembali</button></div>
    ${w.map((x,i)=>qCard(x,'f'+i,()=>{if(S.curId)db.collection('hasil').doc(S.curId).update({detail:JSON.parse(JSON.stringify(S.ans))}).catch(()=>{})})).join('')}`;
  if(!S.retry)try{const r=await db.collection('hasil').add({uid:user.uid,kategori:S.sec,mapel:S.mapel,skor:S.score,total:t,mode:S.exam?'ujian':'latihan',detail:JSON.parse(JSON.stringify(ans)),waktu:firebase.firestore.FieldValue.serverTimestamp()});S.curId=r.id}catch(e){console.error(e)}
}

async function gate(u){
  tabsShow(false);S.admin=false;const em=String(u.email||'').toLowerCase();

<script>

const setTxt=(id,t)=>{const e=$(id);if(e)e.textContent=t};

const normTxt=s=>String(s==null?'':s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const toks=s=>normTxt(s).split(' ').filter(w=>w&&!_STOP.has(w));
const tset=s=>new Set(toks(s));
function jac(A,B){if(!A.size||!B.size)return 0;let i=0;A.forEach(w=>{if(B.has(w))i++});return i/(A.size+B.size-i)}
const makePool=l=>l.map(t=>({t:normTxt(t),s:tset(t)}));
function isDupOf(q,pool,th){th=th||0.8;const n=normTxt(q),s=tset(q);return pool.some(p=>p.t===n||jac(s,p.s)>=th)}
async function existingQs(){
  const s=await db.collection('soal').where('uid','==',user.uid).where('kategori','==',S.sec).where('mapel','==',S.mapel).limit(600).get();

async function dedupe(list){

  if(/^Menengah/.test(g))return 'Trader menengah: penerapan konsep, kombinasi beberapa konfirmasi, manajemen risiko praktis.';

  return 'Pengetahuan umum untuk pelajar dan dewasa, tingkat menengah.';
}

 'Bahasa Inggris':{SD:['greetings and introductions','colors, numbers and shapes','family members and pets','daily activities','classroom objects','simple present tense'],SMP:['simple past tense','comparison of adjectives','descriptive text','procedure text','there is / there are and prepositions','asking and giving opinion'],SMA:['conditional sentences','passive voice','reported speech','analytical exposition','narrative text','relative clauses']},
 'SMC / ICT':['order block','fair value gap','break of structure vs CHoCH','liquidity sweep','premium dan discount','kill zone sesi London dan New York'],

function refreshChips(){S.glv=$('gl').value;setTxt('gchips','');const b=$('gchips');if(b)b.innerHTML=chipsHtml()}

async function gen(){

TINGKAT: ${lv}. PANDUAN TINGKAT: ${guide} SEMUA soal harus pas di tingkat ini: tidak lebih mudah dan tidak lebih sulit, istilah/angka/konteks lazim untuk tingkat itu.
KEBARUAN: pengguna sudah punya banyak soal. Kamu akan diberi daftar soal yang SUDAH ADA; dilarang mengulang, memparafrase, atau memakai struktur, konteks, atau angka yang sama. Tiap soal baru harus menguji konsep atau sub-topik yang berbeda satu sama lain.

function gradeOf13(lv){
  lv=String(lv||'');let m;
  if((m=lv.match(/^(?:SD|SMP|SMA) Kelas (\d+)/)))return[+m[1],+m[1]];
  if(/^TKA SD/.test(lv))return[4,6];if(/^TKA SMP/.test(lv))return[7,9];if(/^TKA SMA|UTBK/.test(lv))return[10,12];
  return null;
}
function scopeOf13(lv){
  const g=gradeOf13(lv),c=CURR13[S.mapel];if(!g||!c)return'';
  const top=g[1],here=[];for(let k=g[0];k<=top;k++)if(c[k])here.push((g[0]!==g[1]?'Kelas '+k+': ':'')+c[k]);
  return here.length?`MATERI YANG BOLEH KELUAR (${S.mapel}, ${lv}): ${here.join(' | ')}. Materi kelas di atas ${top} DILARANG; materi kelas di bawahnya hanya sebagai prasyarat.`:'';
}
function levelGuide(lv){
  const g=String(lv||''),m0=g.match(/^SD Kelas (\d)/),m1=g.match(/^SMP Kelas (\d)/),m2=g.match(/^SMA Kelas (\d+)/);let b;
  if(m0){const n=+m0[1];b=`Siswa SD kelas ${n} (Kurikulum Merdeka fase ${n<=2?'A':n<=4?'B':'C'}). Bahasa sangat sederhana, kalimat pendek, konteks sehari-hari anak, tanpa istilah teknis berlebihan, soal 1-2 langkah. Hanya materi yang sudah diajarkan sampai kelas ${n}.`}
  else if(m1)b=`Siswa SMP kelas ${m1[1]} (Kurikulum Merdeka fase D). Soal 2-3 langkah, istilah teknis dasar. Hanya materi sampai kelas ${m1[1]}.`;
  else if(m2)b=`Siswa SMA kelas ${m2[1]} (Kurikulum Merdeka fase E/F). Penalaran multi-langkah, istilah formal, penerapan konsep. Hanya materi sampai kelas ${m2[1]}.`;
  else if(/^TKA SD/.test(g))b='Tes Kemampuan Akademik tingkat SD (akhir kelas 6): literasi dan numerasi berbasis stimulus singkat (teks/data), penalaran sederhana, sesuai capaian SD.';
  else if(/^TKA SMP/.test(g))b='Tes Kemampuan Akademik tingkat SMP (akhir kelas 9): literasi dan numerasi berbasis stimulus, penalaran 2-3 langkah, sesuai capaian SMP.';
  else if(/^TKA SMA/.test(g))b='Tes Kemampuan Akademik tingkat SMA (akhir kelas 12): penalaran berbasis teks/data, analisis, sesuai capaian SMA.';
  else if(/UTBK/.test(g))b='UTBK-SNBT: penalaran umum, pengetahuan dan pemahaman umum, pemahaman bacaan dan menulis, pengetahuan kuantitatif, literasi bahasa Indonesia dan Inggris, penalaran matematika. Soal HOTS berbasis teks/data, level tinggi.';
  else if(/^A1/.test(g))b='CEFR A1: sekitar 500 kata paling umum, kalimat sangat pendek, present simple/be, topik diri sendiri, keluarga, benda sehari-hari.';
  else if(/^A2/.test(g))b='CEFR A2: kosakata dasar sehari-hari, past simple, perbandingan, future dengan going to, teks pendek tentang rutinitas dan tempat.';
  else if(/^B1/.test(g))b='CEFR B1: present perfect, conditional 0/1/2, passive dasar, reported speech dasar, teks tentang pengalaman, rencana, dan opini sederhana.';
  else if(/^B2/.test(g))b='CEFR B2: struktur kompleks, conditional 3, passive lanjutan, idiom umum, topik abstrak, teks argumentatif.';
  else if(/^C1/.test(g))b='CEFR C1: kosakata lanjutan dan nuansa, struktur inversi, discourse markers, teks akademik/profesional yang padat.';
  else if(/^Pemula/.test(g))b='Trader pemula: konsep dasar dan istilah, tanpa asumsi pengetahuan sebelumnya.';
  else if(/^Menengah/.test(g))b='Trader menengah: penerapan konsep, kombinasi beberapa konfirmasi, manajemen risiko praktis.';
  else if(/^Lanjut/.test(g))b='Trader lanjutan: nuansa struktur pasar, skenario bersyarat, manajemen risiko tingkat lanjut.';
  else b='Pengetahuan umum untuk pelajar dan dewasa, tingkat menengah.';
  return b+' '+scopeOf13(lv);
}
function topicList(lv){
  const g=gradeOf13(lv),c=CURR13[S.mapel];
  if(g&&c){const o=[];for(let k=g[0];k<=g[1];k++)if(c[k])c[k].split(/,\s*(?![^()]*\))/).forEach(t=>{t=t.replace(/^[A-Za-z]+:\s*/,'').trim();if(t)o.push(t)});if(o.length)return o}
  const t=TOPICS[S.mapel];return Array.isArray(t)?t:(t&&t[tierOf(lv)])||[];
}
